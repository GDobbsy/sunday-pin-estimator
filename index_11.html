VIEWS.quote = function (params) {
  const q = byId(state.quotes, params.id);
  if (!q) return '<div class="card"><div class="empty"><h3>Quote not found</h3><p class="small">It may have been reset with the demo data.</p></div></div>';
  if ((q.photos || []).some(function (p) { return !photoCache[p.id]; })) {
    loadQuotePhotos(q).then(function () { if (route.name === 'quote') render(); });
  }
  const c = byId(state.customers, q.customerId);
  const p = byId(state.properties, q.propertyId);
  const st = effectiveStatus(q);
  const recips = q.recipientContactIds.map(function (id) { return byId(state.contacts, id); }).filter(Boolean);
  const primary = quotePrimaryOption(q);
  const e = calculateOptionEconomics(q, primary || { items: [] });
  const ms = marginStatus(e.margin, e.targetMargin);

  let html = '<div class="page-head"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
    '<h1>' + esc(q.quoteNumber || 'Unsaved quote') + '</h1>' +
    '<span class="badge ' + st.toLowerCase() + '">' + st + '</span>' +
    (needsFollowUp(q) ? '<span class="badge warn">Follow up</span>' : '') +
  '</div><div class="sub">' + esc(customerLabel(c)) + ' · ' + esc(propertyLabel(p)) + '</div></div>';

  if (isExpired(q) && q.status !== 'Expired') {

  /* scope + economics per option */

/* Builds the real mailto: the estimator sends this from their own mail app and
   attaches the PDF. Kept as a pure function so it can be checked. */
function buildQuoteEmail(q, message) {
  const recips = q.recipientContactIds.map(function (id) { return byId(state.contacts, id); })
    .filter(Boolean).filter(function (r) { return isEmail(r.email); });
  const opt = quotePrimaryOption(q);
  const total = calculateOptionEconomics(q, opt).revenue;
  const p = byId(state.properties, q.propertyId);
  const co = state.settings.company;
  const subject = co.name + ' — Quote ' + q.quoteNumber + ' — ' + propertyLabel(p);
  const scope = (opt ? opt.items : []).map(function (it) {
    const b = basis(it.billingBasis);
    return '  • ' + it.name + (b.id === 'flat' ? '' : ' — ' + qty(it.quantity) + ' ' + it.unitLabel);
  }).join('\n');
  const body = (message || defaultSendMessage(q)) + '\n\n' +
    'QUOTE ' + q.quoteNumber + '\n' +
    propertyLabel(p) + (propertyAddress(p) ? '\n' + propertyAddress(p) : '') + '\n\n' +
    (scope ? 'Scope of work:\n' + scope + '\n\n' : '') +
    (q.mode === 'options' && q.options.length > 1
      ? q.options.map(function (o) { return o.name + ': ' + money(calculateOptionEconomics(q, o).revenue); }).join('\n') + '\n\n'
      : 'Total: ' + money(total) + '\n\n') +
    'Valid through ' + fmtDate(q.validUntil) + '.\n' +
    'The full proposal is attached as a PDF.\n\n' +
    co.name + '\n' + co.phone + ' · ' + co.email;
  return {
    recipients: recips,
    subject: subject,
    body: body,
    href: 'mailto:' + encodeURIComponent(recips.map(function (r) { return r.email; }).join(',')) +
      '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body)
  };
}

ACTIONS.mailtoQuote = function (d) {
  const q = byId(state.quotes, d.id);
  const mail = buildQuoteEmail(q, $('#sendMsg') ? $('#sendMsg').value.trim() : '');
  if (!mail.recipients.length) { toast('Select a recipient with a valid email', 'bad'); return; }
  recordDelivery(q, mail.recipients, mail.body, 'mailto',
    'Handed to the device email client — delivery not confirmed by this prototype.');
  window.location.href = mail.href;
  closeAllModals();
  toast('Opened your email app — attach the PDF before sending', 'good');
  render();
};

ACTIONS.shareQuote = function (d) {
  const q = byId(state.quotes, d.id);

      ? q.options.map(function (o) { return o.name + ': ' + money(calculateOptionEconomics(q, o).revenue); }).join('\n')
      : money(total)) +
    '\nValid through ' + fmtDate(q.validUntil);
  if (navigator.share) {
    navigator.share({ title: 'Quote ' + q.quoteNumber, text: text }).catch(function () {});
  } else {
    copyText(text, 'Quote summary copied to the clipboard');
  }
};
function copyText(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast(msg, 'good'); }, function () { fallbackCopy(text, msg); });
  } else {
    fallbackCopy(text, msg);
  }
}
function fallbackCopy(text, msg) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(msg, 'good'); }
  catch (e) { toast('Copy not supported in this browser', 'bad'); }
  document.body.removeChild(ta);
}

/* Acceptance is recorded against a CONTACT, not a typed-in name, so the record
   links back to the account. "Someone else" stays available — the person who
   signs is not always on file — and is the only case that takes free text. */
function acceptBody(q) {
  const primary = quotePrimaryOption(q);
  const contacts = contactsFor(q.customerId);
  const preferred = q.recipientContactIds.filter(function (id) { return byId(contacts, id); })[0] ||
    (contacts.filter(function (c) { return c.isPrimary; })[0] || contacts[0] || {}).id || '__other';
  const opts = contacts.map(function (c) {
    return { value: c.id, label: contactLabel(c) + (c.role ? ' — ' + c.role : '') + (c.email ? ' (' + c.email + ')' : '') };
  }).concat([{ value: '__other', label: 'Someone else — not on this account' }]);

  return (q.options.length > 1
      ? fieldSelect('acc_opt', 'Accepted option', primary ? primary.id : '', q.options.map(function (o) {
          return { value: o.id, label: o.name + ' — ' + money(calculateOptionEconomics(q, o).revenue) };
        }))
      : '<div class="kv"><span class="k">Option</span><span class="v">' + esc(primary ? primary.name : '—') + '</span></div>') +
    fieldSelect('acc_contact', 'Accepted by', preferred, opts, { hint: 'Linked to the contact record on this account.' }) +
    '<button class="btn sm mb-12" data-act="acceptAddContact" data-id="' + q.id + '">' + icon('plus', 15) + ' Add Contact</button>' +
    '<div id="accOther"' + (preferred === '__other' ? '' : ' hidden') + '>' +
      fieldText('acc_name', 'Name of the person accepting', '', { required: true }) +
      fieldText('acc_email', 'Their email', '', { type: 'email', inputmode: 'email' }) +
      '<div class="hint mb-12">Recorded on the quote only. Add them as a contact if you will deal with them again.</div>' +
    '</div>' +
    fieldTextarea('acc_note', 'Note (optional)', '', { rows: 3 }) +
    '<div class="notice">Prototype acceptance capture. The production version will use a secure customer link with a timestamped acceptance record.</div>';
}
function openAcceptModal(q) {

    footer: '<button class="btn" data-modal-close>Cancel</button><button class="btn primary" data-act="confirmAccept" data-id="' + q.id + '">Record Acceptance</button>',

ACTIONS.acceptAddContact = function (d) {
  const q = byId(state.quotes, d.id);
  openContactForm(q.customerId, null, function (ct) {
    saveState();
    const body = $('#acceptBody');
    if (body) {
      body.innerHTML = acceptBody(q);
      const sel = $('#acc_contact');
      if (sel) sel.value = ct.id;
      const other = $('#accOther');
      if (other) other.hidden = true;
    }
    toast('Contact added', 'good');
  });
};
ACTIONS.confirmAccept = function (d) {
  const q = byId(state.quotes, d.id);
  clearErrs();
  const choice = val('acc_contact');
  let contactId = null, name, email;
  if (choice && choice !== '__other') {
    const ct = byId(state.contacts, choice);
    if (!ct) { setErr('acc_contact', 'Choose who accepted the quote'); return; }
    contactId = ct.id;
    name = contactLabel(ct);
    email = ct.email;
  } else {
    name = val('acc_name');
    email = val('acc_email');
    if (!name) { setErr('acc_name', 'Enter the name of the person accepting'); return; }
    if (email && !isEmail(email)) { setErr('acc_email', 'Enter a valid email address'); return; }
  }
  const optId = $('#acc_opt') ? val('acc_opt') : (quotePrimaryOption(q) || {}).id;
  const now = new Date().toISOString();
  q.acceptance = { optionId: optId, contactId: contactId, name: name, email: email, note: val('acc_note'), acceptedAt: now };
  q.status = 'Accepted';
  q.acceptedAt = now;
  q.declinedAt = null;
  q.accounting = { status: 'ready_for_accounting', updatedAt: now };
  q.updatedAt = now;
  saveState();
  closeModal();
  toast('Quote accepted', 'good');
  render();
};
ACTIONS.markDeclined = function (d) {

    title: 'Record decline',

};
ACTIONS.confirmDecline = function (d) {

        fieldNumber('act_mat', 'Actual material cost', existing ? existing.actualMaterialCost : '', { min: 0 }) +
      '</div><div class="grid2">' +
        fieldNumber('act_equip', 'Actual equipment / fuel', existing ? existing.actualEquipmentCost : '', { min: 0 }) +
        fieldNumber('act_travel', 'Actual travel cost', existing ? existing.actualTravelCost : '', { min: 0 }) +
      '</div><div class="grid2">' +
        fieldNumber('act_other', 'Other actual cost', existing ? existing.actualOtherCost : '', { min: 0 }) +
        fieldNumber('act_rev', 'Final revenue', existing ? existing.finalRevenue : e.revenue, { min: 0 }) +

      fieldTextarea('act_notes', 'Notes', existing ? existing.notes : '', { rows: 3 }),
    footer: '<button class="btn" data-modal-close>Cancel</button><button class="btn primary" data-act="saveActuals" data-id="' + q.id + '">Save Actuals</button>'

};
ACTIONS.saveActuals = function (d) {
  const q = byId(state.quotes, d.id);
  clearErrs();
  const labor = val('act_labor');
  if (labor === '' || num(labor) <= 0) { setErr('act_labor', 'Enter the actual labor hours'); return; }
  if (val('act_rev') === '' || num(val('act_rev')) < 0) { setErr('act_rev', 'Enter the final revenue'); return; }
  const existing = actualsFor(q.id)[0];
  const rec = existing || { id: uid('act'), quoteId: q.id, createdAt: new Date().toISOString() };
  rec.optionId = (quotePrimaryOption(q) || {}).id;
  rec.completionDate = val('act_date') || todayISO();
  rec.actualLaborHours = num(labor);
  rec.actualMaterialCost = num(val('act_mat'));
  rec.actualEquipmentCost = num(val('act_equip'));
  rec.actualTravelCost = num(val('act_travel'));
  rec.actualOtherCost = num(val('act_other'));
  rec.finalRevenue = num(val('act_rev'));
  rec.notes = val('act_notes');
  rec.updatedAt = new Date().toISOString();
  if (!existing) state.jobActuals.push(rec);
  saveState();
  closeModal();
  toast('Job actuals recorded', 'good');
  render();
};

function varianceCell(v, unit) {
  const cls = v.direction === 'up' ? 'var-up' : (v.direction === 'down' ? 'var-down' : 'var-flat');
  const sign = v.diff > 0 ? '+' : '';
  const amount = unit === '$' ? money(v.diff) : (unit === 'd' ? round(v.diff, 2) + ' days' : hrs(v.diff, 1) + ' hrs');
  return '<span class="' + cls + '">' + sign + amount + ' / ' + sign + pct(v.pct, 1) + '</span>';
}

function renderActualsSummary(q, a) {
  const opt = byId(q.options, a.optionId) || quotePrimaryOption(q);
  const e = calculateOptionEconomics(q, opt);
  /* Actual labor is costed through the same crew model as the estimate, so the
     comparison is like for like. */
  const actualCrew = calculateCrewLabor(num(a.actualLaborHours), q, q.economicsSnapshot);
  const actualLaborCost = actualCrew.totalCost;
  const actualCost = round(actualLaborCost +
    num(a.actualMaterialCost) + num(a.actualEquipmentCost) + num(a.actualTravelCost) + num(a.actualOtherCost), 2);
  const actualContribution = round(num(a.finalRevenue) - actualCost, 2);
  const vLabor = calculateActualVariance(e.laborHours, a.actualLaborHours);
  const vCost = calculateActualVariance(e.directCost, actualCost);
  const vContrib = calculateActualVariance(e.contribution, actualContribution);
  const rates = impliedProductionRates(opt, a.actualLaborHours);

  let h = '<div class="tablewrap"><table class="data"><thead><tr><th></th><th class="num">Estimated</th><th class="num">Actual</th><th class="num">Variance</th></tr></thead><tbody>' +
    '<tr><td>Labor hours</td><td class="num">' + hrs(e.laborHours) + '</td><td class="num">' + hrs(a.actualLaborHours) + '</td><td class="num">' + varianceCell(vLabor, 'hrs') + '</td></tr>' +
    '<tr><td>Crew days paid</td><td class="num">' + (e.paidDays ? round(e.paidDays, 2) : '—') + '</td><td class="num">' + (actualCrew.paidDays ? round(actualCrew.paidDays, 2) : '—') + '</td><td class="num">' + varianceCell(calculateActualVariance(e.paidDays, actualCrew.paidDays), 'd') + '</td></tr>' +
    '<tr><td>Labor cost</td><td class="num">' + money(e.laborCost) + '</td><td class="num">' + money(actualLaborCost) + '</td><td class="num">' + varianceCell(calculateActualVariance(e.laborCost, actualLaborCost), '$') + '</td></tr>' +
    '<tr><td>Direct cost</td><td class="num">' + money(e.directCost) + '</td><td class="num">' + money(actualCost) + '</td><td class="num">' + varianceCell(vCost, '$') + '</td></tr>' +
    '<tr><td>Revenue</td><td class="num">' + money(e.revenue) + '</td><td class="num">' + money(a.finalRevenue) + '</td><td class="num">' + varianceCell(calculateActualVariance(e.revenue, a.finalRevenue), '$') + '</td></tr>' +
    '<tr><td>Contribution</td><td class="num">' + money(e.contribution) + '</td><td class="num">' + money(actualContribution) + '</td><td class="num">' + varianceCell(vContrib, '$') + '</td></tr>' +
    '<tr><td>Contribution margin</td><td class="num">' + pct(e.margin, 1) + '</td><td class="num">' + pct(calculateContributionMargin(a.finalRevenue, actualCost), 1) + '</td><td class="num">—</td></tr>' +
  '</tbody></table></div>';

  if (rates.length) {
    h += '<div class="eyebrow mt-16 mb-8">Implied actual production</div><div class="tablewrap"><table class="data"><thead><tr>' +
      '<th>Service</th><th class="num">Quantity</th><th class="num">Assumed rate</th><th class="num">Implied actual</th></tr></thead><tbody>' +
      rates.map(function (r) {
        return '<tr><td>' + esc(r.name) + '</td><td class="num">' + qty(r.quantity) + ' ' + esc(r.unitLabel) + '</td>' +
          '<td class="num">' + qty(r.estimatedRate) + '</td><td class="num strong">' + qty(r.impliedRate) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="hint">Implied rates are apportioned across the option using each line\'s share of estimated labor. They are shown for learning only — production rates in the catalog are never changed automatically.</div>';
  }
  if (a.notes) h += '<div class="small muted mt-12">' + nl2br(a.notes) + '</div>';
  h += '<div class="kv sub mt-8"><span class="k">Completed</span><span class="v">' + fmtDate(a.completionDate) + '</span></div>';
  return h;
}
/* ==========================================================================
   PROPOSAL — customer-facing projection
   The proposal is rendered from buildProposalData() ONLY. Internal values
   (labor, cost, margin, production rates, adjustments, overrides, internal
   notes) never enter this object, so they cannot leak into the customer view.
   ========================================================================== */

function buildProposalData(q) {
  const s = state.settings;
  const c = byId(state.customers, q.customerId);
  const p = byId(state.properties, q.propertyId);
  const recips = q.recipientContactIds.map(function (id) { return byId(state.contacts, id); }).filter(Boolean);

  const options = q.options.map(function (o) {
    const total = o.items.reduce(function (sum, it) { return sum + calculateRecommendedPrice(it).quoted; }, 0);
    return {
      id: o.id,
      name: o.name,
      description: o.description || '',
      recommended: !!o.recommended,
      total: round(total, 2),
      lines: o.items.map(function (it) {
        const b = basis(it.billingBasis);
        let qtyText = '';
        if (b.id === 'flat') qtyText = '';
        else if (b.id === 'hour') qtyText = qty(it.quantity) + ' ' + (num(it.quantity) === 1 ? 'hour' : 'hours');
        else qtyText = qty(it.quantity) + ' ' + it.unitLabel;
        const svc = state.services.find(function (s) { return s.serviceCode === it.serviceCode; });
        return {
          name: it.name,
          description: it.description || '',
          venue: it.venue || (svc && svc.venue) || 'Either',
          quantityText: qtyText,
          price: calculateRecommendedPrice(it).quoted
        };
      })
    };
  });

  return {
    company: {
      name: s.company.name,
      tagline: s.company.tagline,
      /* The logo carries the wordmark and tagline. If the business name has been
         changed away from the brand, fall back to type so the two never disagree. */
      useLogo: String(s.company.name || '').trim().toLowerCase() === 'sunday pin',
      addressLine: [s.company.address, [s.company.city, s.company.stateProv].filter(Boolean).join(', '), s.company.zip].filter(Boolean).join(' · '),
      phone: s.company.phone,
      email: s.company.email,
      website: s.company.website
    },
    quoteNumber: q.quoteNumber || 'Draft',
    quoteDate: q.quoteDate,
    validUntil: q.validUntil,
    expired: isExpired(q),
    accepted: q.status === 'Accepted',
    acceptedOptionId: q.acceptance ? q.acceptance.optionId : null,
    customerName: customerLabel(c),
    contactNames: recips.map(contactLabel),
    propertyName: propertyLabel(p),
    propertyAddress: propertyAddress(p),
    mode: q.mode,
    options: options,
    photos: proposalPhotos(q).map(function (p) {
      return { id: p.id, caption: p.caption || '', src: (photoCache[p.id] || {}).full || '' };
    }).filter(function (p) { return !!p.src; }),
    customerNotes: q.customerNotes || '',
    assumptions: lines(q.assumptions),
    exclusions: lines(q.exclusions),
    terms: lines(q.terms)
  };
}

function renderProposalHTML(d) {
  let h = '<article class="proposal" id="proposalSheet">';

  /* header */
  h += '<header class="prop-head">' +
    '<div class="prop-brand' + (d.company.useLogo ? ' with-logo' : '') + '">' +
      (d.company.useLogo ? '<img class="prop-logo" src="' + BRAND_LOGO_FULL + '" alt="' + esc(d.company.name) + ' — ' + esc(d.company.tagline) + '">' : '') +
      '<div class="p1">' + esc(d.company.name) + '</div><div class="p2">' + esc(d.company.tagline) + '</div></div>' +
    '<div class="prop-co">' +
      [d.company.addressLine, d.company.phone, d.company.email, d.company.website].filter(Boolean).map(esc).join(' &nbsp;·&nbsp; ') +
    '</div>' +
    '<div class="prop-meta">' +
      '<div><div class="m-k">Quote Number</div><div class="m-v">' + esc(d.quoteNumber) + '</div></div>' +
      '<div><div class="m-k">Quote Date</div><div class="m-v">' + fmtDate(d.quoteDate) + '</div></div>' +
      '<div><div class="m-k">Valid Through</div><div class="m-v">' + fmtDate(d.validUntil) + '</div></div>' +
      '<div><div class="m-k">Prepared For</div><div class="m-v">' + esc(d.customerName) + '</div></div>' +
    '</div>' +
  '</header>';

  /* property */
  h += '<section class="prop-sec"><h3>Property</h3>' +
    '<div class="strong">' + esc(d.propertyName) + '</div>' +
    (d.propertyAddress ? '<div class="small muted">' + esc(d.propertyAddress) + '</div>' : '') +
    (d.contactNames.length ? '<div class="small muted mt-8">Attention: ' + esc(d.contactNames.join(', ')) + '</div>' : '') +
  '</section>';

  /* scope */
  if (d.mode === 'options' && d.options.length > 1) {
    h += '<section class="prop-sec"><h3>Quote Options</h3><div class="prop-opts">';
    d.options.forEach(function (o) {
      h += '<div class="opt-card' + (o.recommended ? ' rec' : '') + '">' +
        '<div class="oc-head"><span class="oc-name">' + esc(o.name) + '</span>' +
          (o.recommended ? '<span class="badge brand">Recommended</span>' : '') +
          (d.acceptedOptionId === o.id ? '<span class="badge accepted">Accepted</span>' : '') + '</div>' +
        (o.description ? '<div class="small muted">' + esc(o.description) + '</div>' : '') +
        '<div class="oc-price">' + money(o.total) + '</div>' +
        '<ul>' + o.lines.map(function (l) {
          return '<li>' + esc(l.name) + (l.quantityText ? ' <span class="muted">— ' + esc(l.quantityText) + '</span>' : '') + '</li>';
        }).join('') + '</ul>' +
      '</div>';
    });
    h += '</div></section>';

    /* detailed scope descriptions, deduplicated across options */
    const seen = {};
    const descs = [];
    d.options.forEach(function (o) {
      o.lines.forEach(function (l) {
        if (!l.description || seen[l.name]) return;
        seen[l.name] = true;
        descs.push(l);
      });
    });
    if (descs.length) {
      h += '<section class="prop-sec"><h3>Scope of Work</h3>' + descs.map(function (l) {
        return '<div class="prop-line"><div class="pl-top"><span class="pl-name">' + esc(l.name) + '</span></div>' +
          '<div class="pl-desc">' + esc(l.description) + '</div></div>';
      }).join('') + '</section>';
    }
  } else {
    const o = d.options[0] || { lines: [], total: 0 };
    const line = function (l) {
      return '<div class="prop-line">' +
        '<div class="pl-top"><span class="pl-name">' + esc(l.name) + '</span><span class="num strong">' + money(l.price) + '</span></div>' +
        (l.quantityText ? '<div class="pl-qty">' + esc(l.quantityText) + '</div>' : '') +
        (l.description ? '<div class="pl-desc">' + esc(l.description) + '</div>' : '') +
      '</div>';
    };
    const ext = o.lines.filter(function (l) { return l.venue === 'Exterior'; });
    const int = o.lines.filter(function (l) { return l.venue === 'Interior'; });
    const both = o.lines.filter(function (l) { return l.venue !== 'Exterior' && l.venue !== 'Interior'; });
    const mixed = ext.length > 0 && int.length > 0;

    h += '<section class="prop-sec"><h3>Scope of Work</h3>';
    if (!o.lines.length) {
      h += '<p class="small muted">No services listed.</p>';
    } else if (mixed) {
      /* A property with both interior and exterior work reads better split. */
      h += '<div class="prop-group"><h4>Exterior</h4>' + ext.map(line).join('') + '</div>' +
        '<div class="prop-group"><h4>Interior</h4>' + int.map(line).join('') + '</div>' +
        (both.length ? '<div class="prop-group"><h4>Additional</h4>' + both.map(line).join('') + '</div>' : '');
    } else {
      h += o.lines.map(line).join('');
    }
    h += '<div class="prop-total"><span class="t-k">Total</span><span class="t-v">' + money(o.total) + '</span></div>' +
    '</section>';
  }

  if (d.photos && d.photos.length) {
    h += '<section class="prop-sec"><h3>Property Photos</h3><div class="prop-photos">' +
      d.photos.map(function (p) {
        return '<figure><img src="' + p.src + '" alt="' + esc(p.caption || 'Property photo') + '">' +
          (p.caption ? '<figcaption>' + esc(p.caption) + '</figcaption>' : '') + '</figure>';
      }).join('') + '</div></section>';
  }

  if (d.customerNotes) {
    h += '<section class="prop-sec"><h3>Notes</h3><div class="prop-body-text">' + esc(d.customerNotes) + '</div></section>';
  }
  if (d.assumptions.length) {
    h += '<section class="prop-sec"><h3>Assumptions</h3><ul class="prop-list">' + d.assumptions.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
  }
  if (d.exclusions.length) {
    h += '<section class="prop-sec"><h3>Exclusions</h3><ul class="prop-list">' + d.exclusions.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
  }
  if (d.terms.length) {
    h += '<section class="prop-sec"><h3>Terms</h3><ul class="prop-list">' + d.terms.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
  }

  /* acceptance */
  h += '<section class="prop-sec"><h3>Acceptance</h3>' +
    '<div class="sign-box">' +
      '<div class="small">By signing below, the scope and pricing shown above are approved and Sunday Pin is authorised to schedule the work.' +
      (d.mode === 'options' && d.options.length > 1 ? ' Please indicate the option selected.' : '') + '</div>' +
      '<div class="grid2 mt-16">' +
        '<div><div class="sign-line"></div><div class="sign-cap">Authorised Signature</div></div>' +
        '<div><div class="sign-line"></div><div class="sign-cap">Date</div></div>' +
      '</div>' +
      '<div class="grid2 mt-16">' +
        '<div><div class="sign-line"></div><div class="sign-cap">Printed Name</div></div>' +
        '<div><div class="sign-line"></div><div class="sign-cap">' + (d.mode === 'options' && d.options.length > 1 ? 'Option Selected' : 'Purchase Order / Reference') + '</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="small muted mt-12">Questions? ' + esc(d.company.phone) + ' · ' + esc(d.company.email) + '</div>' +
  '</section>';

  h += '</article>';
  return h;
}

      '<button class="btn" data-act="openQuote" data-id="' + q.id + '">Back to quote record</button>' +
    '</div>' +
    '<div class="btn-row mt-12">' +
      '<button class="btn" data-act="markAccepted" data-id="' + q.id + '">' + icon('check', 16) + ' Accept</button>' +
      '<button class="btn danger" data-act="markDeclined" data-id="' + q.id + '">Decline</button>' +

  return html;
};

/* ==========================================================================
   PRINT / SAVE PDF
   The proposal is rendered into a hidden print root, so "Save PDF" works from
   the quote record and the send flow, not only from the proposal screen. The
   document title becomes the saved file's name.
   ========================================================================== */
function printQuote(quoteId) {
  const q = byId(state.quotes, quoteId);
  if (!q) return;
  const root = document.getElementById('printRoot');
  if (!root) { window.print(); return; }
  const customer = customerLabel(byId(state.customers, q.customerId));
  const title = document.title;
  root.innerHTML = renderProposalHTML(buildProposalData(q));
  document.body.classList.add('printing');
  document.title = (q.quoteNumber || 'Quote') + ' ' + state.settings.company.name + ' — ' + customer;
  const cleanup = function () {
    document.body.classList.remove('printing');
    document.title = title;
    root.innerHTML = '';
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  window.print();
  setTimeout(cleanup, 1500);      // Safari does not always fire afterprint
}
ACTIONS.printQuote = function (d) { printQuote(d.id); };
/* ==========================================================================
   PDF GENERATION
   Builds the customer proposal as a real, text-based PDF inside the browser,
   so it can be attached to an email rather than only printed. It is generated
   from buildProposalData() — the same customer-safe projection the screen uses
   — so internal figures cannot reach it either.
   ========================================================================== */

const PDF_COLORS = {
  navy: [16, 31, 48],
  ink: [20, 32, 43],
  ink2: [60, 74, 86],
  muted: [109, 119, 131],
  accent: [107, 119, 82],
  line: [214, 211, 203]
};

function pdfAvailable() {
  return typeof window !== 'undefined' && window.jspdf && window.jspdf.jsPDF;
}

function generateQuotePdf(q) {
  if (!pdfAvailable()) return null;
  const d = buildProposalData(q);
  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter', compress: true });

  const M = 54, PW = 612, PH = 792, CW = PW - M * 2, BOTTOM = PH - 58;
  let y = M;

  const setFont = function (style, size, color) {
    doc.setFont('helvetica', style);
    doc.setFontSize(size);
    const c = color || PDF_COLORS.ink;
    doc.setTextColor(c[0], c[1], c[2]);
  };
  const rule = function (yy, color, width) {
    const c = color || PDF_COLORS.line;
    doc.setDrawColor(c[0], c[1], c[2]);
    doc.setLineWidth(width || 0.6);
    doc.line(M, yy, PW - M, yy);
  };
  const ensure = function (h) {
    if (y + h > BOTTOM) { doc.addPage(); y = M; }
  };
  /* Wrapped paragraph. Returns the height used. */
  const para = function (text, opts) {
    opts = opts || {};
    const size = opts.size || 9.5;
    const lh = opts.lh || size * 1.45;
    const width = opts.width || CW;
    const x = opts.x || M;
    setFont(opts.style || 'normal', size, opts.color || PDF_COLORS.ink2);
    const lines = doc.splitTextToSize(String(text || ''), width);
    lines.forEach(function (ln) {
      ensure(lh);
      doc.text(ln, x, y);
      y += lh;
    });
    return lines.length * lh;
  };
  const sectionTitle = function (title, reserve) {
    ensure(34 + (reserve || 0));
    setFont('bold', 8, PDF_COLORS.accent);
    doc.setCharSpace(1.1);
    doc.text(String(title).toUpperCase(), M, y);
    doc.setCharSpace(0);
    y += 7;
    rule(y);
    y += 15;
  };
  const bullets = function (items) {
    items.forEach(function (t) {
      setFont('normal', 9.5, PDF_COLORS.ink2);
      const lines = doc.splitTextToSize(String(t), CW - 16);
      ensure(lines.length * 13.5 + 3);
      doc.setFillColor(PDF_COLORS.accent[0], PDF_COLORS.accent[1], PDF_COLORS.accent[2]);
      doc.circle(M + 3, y - 3, 1.6, 'F');
      lines.forEach(function (ln, i) {
        doc.text(ln, M + 16, y);
        y += 13.5;
        if (i < lines.length - 1) ensure(13.5);
      });
      y += 3;
    });
  };

  /* ---------- header ---------- */
  if (d.company.useLogo && typeof BRAND_LOGO_FULL === 'string') {
    const lw = 132, lh = lw * (434 / 520);
    doc.addImage(BRAND_LOGO_FULL, 'PNG', M, y, lw, lh);
    y += lh + 16;
  } else {
    setFont('bold', 20, PDF_COLORS.navy);
    doc.text(d.company.name, M, y + 16);
    y += 24;
    setFont('normal', 8, PDF_COLORS.muted);
    doc.setCharSpace(1.4);
    doc.text(String(d.company.tagline || '').toUpperCase(), M, y);
    doc.setCharSpace(0);
    y += 16;
  }

  setFont('normal', 8.5, PDF_COLORS.muted);
  const contact = [d.company.addressLine, d.company.phone, d.company.email, d.company.website]
    .filter(Boolean).join('   ·   ');
  if (contact) { doc.text(contact, M, y); y += 16; }

  /* meta grid: two columns, two rows */
  const meta = [
    ['Quote Number', d.quoteNumber],
    ['Quote Date', fmtDate(d.quoteDate)],
    ['Valid Through', fmtDate(d.validUntil)],
    ['Prepared For', d.customerName]
  ];
  const colX = [M, M + CW / 2];
  meta.forEach(function (pair, i) {
    const x = colX[i % 2];
    if (i % 2 === 0 && i > 0) y += 30;
    setFont('bold', 7.5, PDF_COLORS.muted);
    doc.setCharSpace(0.9);
    doc.text(pair[0].toUpperCase(), x, y);
    doc.setCharSpace(0);
    setFont('bold', 10.5, PDF_COLORS.ink);
    doc.text(String(pair[1] || '—'), x, y + 14);
  });
  y += 28;
  rule(y, PDF_COLORS.navy, 1.6);
  y += 24;

  /* ---------- property ---------- */
  sectionTitle('Property', 40);
  setFont('bold', 11, PDF_COLORS.ink);
  ensure(16); doc.text(d.propertyName, M, y); y += 15;
  if (d.propertyAddress) para(d.propertyAddress, { size: 9.5, color: PDF_COLORS.muted });
  if (d.contactNames.length) para('Attention: ' + d.contactNames.join(', '), { size: 9, color: PDF_COLORS.muted });
  y += 12;

  /* ---------- scope ---------- */
  const lineItem = function (l, showPrice) {
    ensure(30);
    setFont('bold', 10.5, PDF_COLORS.ink);
    const nameWidth = showPrice ? CW - 90 : CW;
    const nameLines = doc.splitTextToSize(l.name, nameWidth);
    const startY = y;
    nameLines.forEach(function (ln) { ensure(14); doc.text(ln, M, y); y += 14; });
    if (showPrice) {
      setFont('bold', 10.5, PDF_COLORS.ink);
      doc.text(money(l.price), PW - M, startY, { align: 'right' });
    }
    if (l.quantityText) {
      setFont('normal', 9, PDF_COLORS.muted);
      ensure(13); doc.text(l.quantityText, M, y); y += 13;
    }
    if (l.description) para(l.description, { size: 9.5, color: PDF_COLORS.ink2 });
    y += 10;
    rule(y - 5);
    y += 6;
  };

  if (d.mode === 'options' && d.options.length > 1) {
    sectionTitle('Quote Options', 80);
    d.options.forEach(function (o) {
      ensure(70);
      const boxTop = y - 12;
      setFont('bold', 13, PDF_COLORS.ink);
      doc.text(o.name, M + 14, y + 2);
      const nameW = doc.getTextWidth(o.name);
      if (o.recommended) {
        setFont('bold', 7.5, PDF_COLORS.accent);
        doc.setCharSpace(0.8);
        doc.text('RECOMMENDED', M + 14 + nameW + 14, y + 2);
        doc.setCharSpace(0);
      }
      setFont('bold', 15, PDF_COLORS.navy);
      doc.text(money(o.total), PW - M - 14, y + 3, { align: 'right' });
      y += 18;
      if (o.description) {
        para(o.description, { size: 9, color: PDF_COLORS.muted, x: M + 14, width: CW - 28 });
      }
      y += 2;
      o.lines.forEach(function (l) {
        ensure(14);
        setFont('normal', 9.5, PDF_COLORS.ink2);
        const t = '•  ' + l.name + (l.quantityText ? '  —  ' + l.quantityText : '');
        doc.splitTextToSize(t, CW - 40).forEach(function (ln) { ensure(13); doc.text(ln, M + 14, y); y += 13; });
      });
      y += 8;
      /* box around the option */
      doc.setDrawColor(PDF_COLORS.line[0], PDF_COLORS.line[1], PDF_COLORS.line[2]);
      doc.setLineWidth(o.recommended ? 1.4 : 0.6);
      if (o.recommended) doc.setDrawColor(PDF_COLORS.navy[0], PDF_COLORS.navy[1], PDF_COLORS.navy[2]);
      doc.roundedRect(M, boxTop, CW, y - boxTop - 2, 5, 5, 'S');
      y += 14;
    });

    const seen = {}, descs = [];
    d.options.forEach(function (o) {
      o.lines.forEach(function (l) {
        if (!l.description || seen[l.name]) return;
        seen[l.name] = true; descs.push(l);
      });
    });
    if (descs.length) {
      sectionTitle('Scope of Work');
      descs.forEach(function (l) { lineItem({ name: l.name, description: l.description }, false); });
    }
  } else {
    const o = d.options[0] || { lines: [], total: 0 };
    sectionTitle('Scope of Work');
    const ext = o.lines.filter(function (l) { return l.venue === 'Exterior'; });
    const int = o.lines.filter(function (l) { return l.venue === 'Interior'; });
    const both = o.lines.filter(function (l) { return l.venue !== 'Exterior' && l.venue !== 'Interior'; });
    const group = function (label, list) {
      if (!list.length) return;
      ensure(24);
      setFont('bold', 8, PDF_COLORS.accent);
      doc.setCharSpace(0.9);
      doc.text(label.toUpperCase(), M, y);
      doc.setCharSpace(0);
      y += 14;
      list.forEach(function (l) { lineItem(l, true); });
      y += 4;
    };
    if (ext.length && int.length) {
      group('Exterior', ext); group('Interior', int); group('Additional', both);
    } else {
      o.lines.forEach(function (l) { lineItem(l, true); });
    }
    ensure(40);
    rule(y - 2, PDF_COLORS.navy, 1.6);
    y += 20;
    setFont('bold', 12, PDF_COLORS.ink);
    doc.text('Total', M, y);
    setFont('bold', 19, PDF_COLORS.navy);
    doc.text(money(o.total), PW - M, y + 2, { align: 'right' });
    y += 30;
  }

  /* ---------- property photos ---------- */
  if (d.photos && d.photos.length) {
    const gap = 14, cols = 2, cw = (CW - gap) / cols, maxH = 190;
    const boxOf = function (ph) {
      const cached = photoCache[ph.id] || {};
      const ratio = cached.h && cached.w ? cached.h / cached.w : 0.75;
      let iw = cw, ih = cw * ratio;
      if (ih > maxH) { ih = maxH; iw = ih / ratio; }   // portrait: shrink width, never squash
      return { iw: iw, ih: ih, capH: ph.caption ? 14 : 0 };
    };
    sectionTitle('Property Photos', boxOf(d.photos[0]).ih + 20);
    let col = 0, rowTop = y, rowH = 0;
    d.photos.forEach(function (ph) {
      const b = boxOf(ph);
      if (col === 0) { ensure(b.ih + b.capH + gap); rowTop = y; rowH = 0; }
      const x = M + col * (cw + gap);
      try { doc.addImage(ph.src, 'JPEG', x, rowTop, b.iw, b.ih); } catch (e) { /* skip an unreadable image */ }
      if (ph.caption) {
        setFont('normal', 8, PDF_COLORS.muted);
        doc.text(doc.splitTextToSize(ph.caption, cw)[0], x, rowTop + b.ih + 11);
      }
      rowH = Math.max(rowH, b.ih + b.capH);
      col += 1;
      if (col === cols) { col = 0; y = rowTop + rowH + gap; }
    });
    if (col !== 0) y = rowTop + rowH + gap;
    y += 6;
  }

  /* ---------- notes, assumptions, exclusions, terms ---------- */
  if (d.customerNotes) { sectionTitle('Notes', 30); para(d.customerNotes); y += 12; }
  if (d.assumptions.length) { sectionTitle('Assumptions', 30); bullets(d.assumptions); y += 8; }
  if (d.exclusions.length) { sectionTitle('Exclusions', 30); bullets(d.exclusions); y += 8; }
  if (d.terms.length) { sectionTitle('Terms', 30); bullets(d.terms); y += 8; }

  /* ---------- acceptance ---------- */
  ensure(150);
  sectionTitle('Acceptance');
  para('By signing below, the scope and pricing shown above are approved and ' + d.company.name +
    ' is authorised to schedule the work.' +
    (d.mode === 'options' && d.options.length > 1 ? ' Please indicate the option selected.' : ''),
    { size: 9.5 });
  y += 26;
  const half = (CW - 30) / 2;
  const sigLine = function (label, x) {
    doc.setDrawColor(PDF_COLORS.muted[0], PDF_COLORS.muted[1], PDF_COLORS.muted[2]);
    doc.setLineWidth(0.6);
    doc.line(x, y, x + half, y);
    setFont('normal', 7.5, PDF_COLORS.muted);
    doc.setCharSpace(0.8);
    doc.text(label.toUpperCase(), x, y + 11);
    doc.setCharSpace(0);
  };
  sigLine('Authorised Signature', M);
  sigLine('Date', M + half + 30);
  y += 52;
  ensure(30);
  sigLine('Printed Name', M);
  sigLine(d.mode === 'options' && d.options.length > 1 ? 'Option Selected' : 'Purchase Order / Reference', M + half + 30);
  y += 30;

  /* ---------- footers ---------- */
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setDrawColor(PDF_COLORS.line[0], PDF_COLORS.line[1], PDF_COLORS.line[2]);
    doc.setLineWidth(0.6);
    doc.line(M, PH - 44, PW - M, PH - 44);
    setFont('normal', 8, PDF_COLORS.muted);
    doc.text(d.company.name + '  ·  ' + d.quoteNumber + '  ·  ' + d.company.phone, M, PH - 30);
    doc.text('Page ' + i + ' of ' + pages, PW - M, PH - 30, { align: 'right' });
  }

  const safe = function (t) { return String(t || '').replace(/[^\w\s.-]/g, '').replace(/\s+/g, ' ').trim(); };
  return {
    blob: doc.output('blob'),
    dataUri: doc.output('datauristring'),
    filename: safe(d.quoteNumber) + ' ' + safe(d.company.name) + ' - ' + safe(d.customerName) + '.pdf'
  };
}

/* --- delivering the file ------------------------------------------------ */
function canShareFiles() {
  try {
    return !!(navigator.canShare && navigator.share &&
      navigator.canShare({ files: [new File(['x'], 'x.pdf', { type: 'application/pdf' })] }));
  } catch (e) { return false; }
}

function saveQuotePdf(quoteId) {
  const q = byId(state.quotes, quoteId);
  const pdf = generateQuotePdf(q);
  if (!pdf) { printQuote(quoteId); return; }        // fall back to the print dialog
  if (isHostedViewer) {
    if (!hostedDownloads || !hostedDownloads.save) {
      toast('Saving files is not available in this hosted preview — use the downloaded file', 'bad');
      return;
    }
    hostedDownloads.save({ filename: pdf.filename, data: pdf.blob }).then(
      function () { toast('Proposal PDF saved', 'good'); },
      function (err) { toast(err && err.code === 'declined' ? 'Save cancelled' : 'Could not save the PDF here', 'bad'); }
    );
    return;
  }
  const url = URL.createObjectURL(pdf.blob);
  const a = document.createElement('a');
  a.href = url; a.download = pdf.filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  toast('Proposal PDF saved', 'good');
}

/* The closest thing to a real send without a server: hand the PDF and the
   message to the phone's share sheet, which passes both to Mail with the file
   already attached. */
function shareQuotePdf(quoteId) {
  const q = byId(state.quotes, quoteId);
  const pdf = generateQuotePdf(q);
  if (!pdf) { toast('PDF generation is unavailable here', 'bad'); return false; }
  const file = new File([pdf.blob], pdf.filename, { type: 'application/pdf' });
  if (!canShareFiles()) return false;
  const mail = buildQuoteEmail(q, $('#sendMsg') ? $('#sendMsg').value.trim() : '');
  navigator.share({ files: [file], title: mail.subject, text: mail.body }).then(function () {
    recordDelivery(q, mail.recipients, mail.body, 'share_sheet',
      'Handed to the device share sheet with the PDF attached — delivery not confirmed by this prototype.');
    closeAllModals();
    toast('Shared with the PDF attached', 'good');
    render();
  }, function () { /* the user cancelled the share sheet */ });
  return true;
}

function recordDelivery(q, recipients, message, method, note) {
  state.quoteDeliveries.push({
    id: uid('del'), quoteId: q.id, optionId: null,
    recipients: (recipients || []).map(function (r) { return { contactId: r.id, name: contactLabel(r), email: r.email }; }),
    message: message, method: method, sentAt: new Date().toISOString(), note: note
  });
  if (q.status === 'Draft' || q.status === 'Ready') { q.status = 'Sent'; q.sentAt = new Date().toISOString(); }
  q.updatedAt = new Date().toISOString();
  saveState();
}

ACTIONS.savePdf = function (d) { saveQuotePdf(d.id); };
ACTIONS.shareWithPdf = function (d) {
  if (!shareQuotePdf(d.id)) {
    /* Desktop and older browsers: save the file, then open the mail app. */
    saveQuotePdf(d.id);
    setTimeout(function () { ACTIONS.mailtoQuote(d); }, 600);
  }
};

/* --- shared entity forms (used inline from the quote flow too) ----------
   ONE form creates a person, the account behind them and, if you have it, the
   property — because for a homeowner those are the same walk-up. The account
   layer still exists (a golf club has several contacts and outlives any of
   them) but the estimator never types a name twice to get one.
   ------------------------------------------------------------------------ */
function openCustomerForm(existing, onSave, opts) {
  if (existing) return openCustomerEditForm(existing, onSave);
  opts = opts || {};
  const form = {
    customerId: null,                 // set when joining an existing account
    customerType: 'Residential',
    withProperty: opts.withProperty !== false
  };
  openModal({
    title: 'New customer',
    body: '<div id="custFormBody">' + customerFormBody(form) + '</div>',
    footer: '<button class="btn" data-modal-close>Cancel</button>' +
      '<button class="btn primary" data-act="saveCustomerForm">Save</button>',
    onMount: function (root) {
      root.__form = form;
      root.__onSave = onSave;
      root.addEventListener('click', function (e) {
        const chip = e.target.closest('[data-pick="ctype"]');
        if (chip) {
          form.customerType = chip.getAttribute('data-v');
          $$('#ctypeChips .chip', root).forEach(function (x) {
            x.setAttribute('aria-pressed', x.getAttribute('data-v') === form.customerType);
          });
          return;
        }
        const join = e.target.closest('[data-join]');
        if (join) {
          form.customerId = join.getAttribute('data-join');
          form.snapshot = readCustomerForm(root);
          $('#custFormBody', root).innerHTML = customerFormBody(form);
          return;
        }
        const leave = e.target.closest('[data-leave-account]');
        if (leave) {
          form.customerId = null;
          form.snapshot = readCustomerForm(root);
          $('#custFormBody', root).innerHTML = customerFormBody(form);
        }
      });
      root.addEventListener('input', function (e) {
        if (!e.target.closest('#cu_company')) return;
        renderCompanyMatches(root, e.target.value);
      });
    }
  });
}

function customerFormBody(form) {
  const v = form.snapshot || {};
  const joined = form.customerId ? byId(state.customers, form.customerId) : null;

  let h = '';
  if (joined) {
    h += '<div class="notice" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      '<span style="flex:1;min-width:180px">Adding a contact to <strong>' + esc(customerLabel(joined)) + '</strong>' +
      ' — an existing account with ' + contactsFor(joined.id).length + ' contact' + (contactsFor(joined.id).length === 1 ? '' : 's') + '.</span>' +
      '<button class="btn sm" data-leave-account>Not this one</button></div>';
  } else {
    h += '<div class="lbl">Customer type</div><div class="chiprow mb-12" id="ctypeChips">' +
      CUSTOMER_TYPES.map(function (t) {
        return '<button type="button" class="chip" data-pick="ctype" data-v="' + t + '" aria-pressed="' + (form.customerType === t) + '">' + t + '</button>';
      }).join('') + '</div>';
  }

  h += '<div class="grid2">' +
      fieldText('cu_first', 'First name', v.first, { required: true, autocomplete: 'given-name' }) +
      fieldText('cu_last', 'Last name', v.last, { required: true, autocomplete: 'family-name' }) +
    '</div>' +
    '<div class="grid2">' +
      fieldText('cu_email', 'Email', v.email, { type: 'email', inputmode: 'email' }) +
      fieldText('cu_phone', 'Phone', v.phone, { type: 'tel', inputmode: 'tel' }) +
    '</div>';

  if (!joined) {
    h += fieldText('cu_company', 'Company', v.company, { placeholder: 'Leave blank for a homeowner' }) +
      '<div id="companyMatch"></div>';
  }

  if (form.withProperty) {
    h += '<div class="divider-label">Property (optional)</div>' +
      fieldText('pr_addr', 'Street address', v.addr, { autocomplete: 'address-line1', placeholder: 'Add it now, or on the next step' }) +
      '<div class="grid3">' +
        fieldText('pr_city', 'City', v.city) +
        fieldText('pr_state', 'State', v.state) +
        fieldText('pr_zip', 'ZIP', v.zip, { inputmode: 'numeric' }) +

  }

  h += fieldTextarea('cu_notes', 'Notes', v.notes, { rows: 2 });
  return h;
}

function readCustomerForm(root) {
  return {
    first: val('cu_first', root), last: val('cu_last', root),
    email: val('cu_email', root), phone: val('cu_phone', root),
    company: val('cu_company', root), notes: val('cu_notes', root),
    addr: val('pr_addr', root), city: val('pr_city', root),

  };
}

/* Typing a company that already exists offers to join it, instead of quietly
   creating a second Atlanta Country Club. */
function renderCompanyMatches(root, text) {
  const box = $('#companyMatch', root);
  if (!box) return;
  const t = String(text || '').trim().toLowerCase();
  if (t.length < 2) { box.innerHTML = ''; return; }
  const hits = state.customers.filter(function (c) {
    return c.companyName && c.companyName.toLowerCase().indexOf(t) >= 0;
  }).slice(0, 3);
  box.innerHTML = hits.length
    ? '<div class="hint mb-8">Already on file:</div><div class="btn-row mb-12">' + hits.map(function (c) {
        return '<button class="btn sm" data-join="' + c.id + '">' + icon('plus', 14) + ' Add to ' + esc(c.companyName) + '</button>';
      }).join('') + '</div>'
    : '';
}

ACTIONS.saveCustomerForm = function () {
  const root = modalStack[modalStack.length - 1];
  const form = root.__form;
  const v = readCustomerForm(root);
  clearErrs(root);

  if (!v.first) { setErr('cu_first', 'Enter a first name', root); return; }
  if (!v.last) { setErr('cu_last', 'Enter a last name', root); return; }
  if (v.email && !isEmail(v.email)) { setErr('cu_email', 'Enter a valid email address', root); return; }

  /* 1. the account: an existing one, the company, or the person themselves */
  let customer = form.customerId ? byId(state.customers, form.customerId) : null;
  if (!customer) {
    const company = v.company;
    const type = company && form.customerType === 'Residential' ? 'Commercial' : form.customerType;
    customer = makeCustomer({
      customerType: type,
      entityType: company ? 'Company' : 'Individual',
      companyName: company,
      firstName: company ? '' : v.first,
      lastName: company ? '' : v.last,
      notes: v.notes
    });
    state.customers.push(customer);
  } else if (v.notes) {
    customer.notes = (customer.notes ? customer.notes + '\n' : '') + v.notes;
  }

  /* 2. the person */
  const contact = makeContact({
    customerId: customer.id,
    firstName: v.first, lastName: v.last,
    email: v.email, phone: v.phone,
    isPrimary: contactsFor(customer.id).length === 0
  });
  state.contacts.push(contact);

  /* 3. the property, if they had the address to hand */
  let property = null;
  if (v.addr || v.city) {
    property = makeProperty({
      customerId: customer.id,
      name: customer.entityType === 'Company'
        ? (propertiesFor(customer.id).length ? 'Additional Property' : 'Main Property')
        : 'Primary Residence',
      address: v.addr, city: v.city, state: v.state, zip: v.zip,
      propertyType: ({ Residential: 'Home', Commercial: 'Commercial Building', Golf: 'Golf Club', Event: 'Event Venue', Other: 'Other' })[customer.customerType] || 'Home'
    });
    state.properties.push(property);
  }

  saveState();
  const cb = root.__onSave;
  closeModal();
  if (cb) cb(customer, { contact: contact, property: property });
};

/* ==========================================================================
   PROPERTY PHOTOS
   Photos are far too big for localStorage — a couple of them would blow the
   ~5 MB quota and take every quote down with it. So the image data lives in
   IndexedDB (blobs, hundreds of MB available) and the quote keeps only a small
   record: id, caption, and whether the customer is allowed to see it.

   Default is INTERNAL. A photo reaches the proposal only when it is explicitly
   marked, so nothing is ever sent to a customer by accident.
   ========================================================================== */

const PHOTO_DB = 'sundaypin.photos';
const PHOTO_STORE = 'photos';
const PHOTO_MAX_EDGE = 1500;
const PHOTO_QUALITY = 0.72;
const PHOTO_THUMB_EDGE = 360;
const PHOTO_MAX_PER_QUOTE = 12;

let _photoDb = null;
function photoDb() {
  if (_photoDb) return Promise.resolve(_photoDb);
  return new Promise(function (resolve, reject) {
    if (!window.indexedDB) { reject(new Error('no-indexeddb')); return; }
    const req = indexedDB.open(PHOTO_DB, 1);
    req.onupgradeneeded = function () {
      const db = req.result;
      if (!db.objectStoreNames.contains(PHOTO_STORE)) {
        const store = db.createObjectStore(PHOTO_STORE, { keyPath: 'id' });
        store.createIndex('quoteId', 'quoteId', { unique: false });
      }
    };
    req.onsuccess = function () { _photoDb = req.result; resolve(_photoDb); };
    req.onerror = function () { reject(req.error); };
  });
}
function photoTx(mode) {
  return photoDb().then(function (db) {
    return db.transaction(PHOTO_STORE, mode).objectStore(PHOTO_STORE);
  });
}
function idbRequest(req) {
  return new Promise(function (resolve, reject) {
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function photoPut(rec) { return photoTx('readwrite').then(function (s) { return idbRequest(s.put(rec)); }); }
function photoGet(id) { return photoTx('readonly').then(function (s) { return idbRequest(s.get(id)); }); }
function photoDelete(id) { return photoTx('readwrite').then(function (s) { return idbRequest(s.delete(id)); }); }
function photoAll() { return photoTx('readonly').then(function (s) { return idbRequest(s.getAll()); }); }

/* In-memory cache of data URLs for whatever is currently on screen. */
const photoCache = {};

function loadQuotePhotos(quote) {
  const recs = (quote && quote.photos) || [];
  return Promise.all(recs.map(function (p) {
    if (photoCache[p.id]) return Promise.resolve();
    return photoGet(p.id).then(function (r) {
      if (r) photoCache[p.id] = { thumb: r.thumb, full: r.full, w: r.w, h: r.h };
    }).catch(function () {});
  }));
}

/* --- capture -------------------------------------------------------------
   Phone photos are 3–5 MB each. They are resized and recompressed before
   anything is stored, so a quote's worth of photos costs a few hundred KB.
   ------------------------------------------------------------------------ */
function processImageFile(file) {
  return new Promise(function (resolve, reject) {
    if (!/^image\//.test(file.type)) { reject(new Error('not-an-image')); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      const draw = function (maxEdge, quality) {
        const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        return { url: canvas.toDataURL('image/jpeg', quality), w: w, h: h };
      };
      const full = draw(PHOTO_MAX_EDGE, PHOTO_QUALITY);
      const thumb = draw(PHOTO_THUMB_EDGE, 0.62);
      URL.revokeObjectURL(url);
      resolve({ full: full.url, thumb: thumb.url, w: full.w, h: full.h });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode-failed')); };
    img.src = url;
  });
}

function addPhotosToQuote(quote, files) {
  const list = Array.prototype.slice.call(files || []);
  if (!list.length) return Promise.resolve(0);
  quote.photos = quote.photos || [];
  const room = PHOTO_MAX_PER_QUOTE - quote.photos.length;
  if (room <= 0) {
    toast('This quote already has ' + PHOTO_MAX_PER_QUOTE + ' photos', 'bad');
    return Promise.resolve(0);
  }
  const take = list.slice(0, room);
  if (take.length < list.length) toast('Added ' + take.length + ' — ' + PHOTO_MAX_PER_QUOTE + ' photos per quote', 'bad');

  return take.reduce(function (chain, file) {
    return chain.then(function (n) {
      return processImageFile(file).then(function (img) {
        const id = uid('pho');
        return photoPut({
          id: id, quoteId: quote.id, full: img.full, thumb: img.thumb,
          w: img.w, h: img.h, createdAt: new Date().toISOString()
        }).then(function () {
          photoCache[id] = { thumb: img.thumb, full: img.full, w: img.w, h: img.h };
          quote.photos.push({
            id: id,
            caption: '',
            includeInProposal: false,     // internal until you say otherwise
            addedAt: new Date().toISOString()
          });
          return n + 1;
        });
      }).catch(function (e) {
        console.error('photo failed', e);
        toast('One photo could not be read', 'bad');
        return n;
      });
    });
  }, Promise.resolve(0));
}

function removeQuotePhoto(quote, photoId) {
  quote.photos = (quote.photos || []).filter(function (p) { return p.id !== photoId; });
  delete photoCache[photoId];
  return photoDelete(photoId).catch(function () {});
}
function quotePhotoRecord(quote, photoId) {
  return (quote.photos || []).find(function (p) { return p.id === photoId; }) || null;
}
function proposalPhotos(quote) {
  return (quote.photos || []).filter(function (p) { return p.includeInProposal; });
}

/* ==========================================================================
   PHOTO UI
   ========================================================================== */
function renderPhotoCard(q) {
  const photos = q.photos || [];
  const shown = proposalPhotos(q).length;
  let h = '<div class="card"><div class="card-head"><h3>Property photos</h3>' +
    (photos.length ? '<span class="badge">' + photos.length + ' photo' + (photos.length === 1 ? '' : 's') +
      (shown ? ' · ' + shown + ' in proposal' : '') + '</span>' : '') +
    '</div>';

  if (!photos.length) {
    h += '<p class="small muted">Photograph the surfaces you are quoting. Photos stay internal unless you mark them for the proposal.</p>';
  } else {
    h += '<div class="photo-grid">' + photos.map(function (p) {
      const src = (photoCache[p.id] || {}).thumb;
      return '<button class="photo-tile' + (p.includeInProposal ? ' shown' : '') + '" data-act="openPhoto" data-id="' + p.id + '">' +
        (src ? '<img src="' + src + '" alt="' + esc(p.caption || 'Property photo') + '">' : '<span class="photo-missing">' + icon('alert', 18) + '</span>') +
        (p.includeInProposal ? '<span class="photo-flag">In proposal</span>' : '') +
        (p.caption ? '<span class="photo-cap">' + esc(p.caption) + '</span>' : '') +
      '</button>';
    }).join('') + '</div>';
  }

  h += '<input type="file" id="photoInput" accept="image/*" multiple hidden>' +
    '<div class="btn-row mt-12">' +
      '<button class="btn primary" data-act="pickPhotos" data-id="' + q.id + '">' + icon('camera', 17) + ' Add Photos</button>' +
    '</div>' +
    '<div class="hint">Stored on this device only, resized to keep them small. They are included in your JSON backup.</div>' +
  '</div>';
  return h;
}

ACTIONS.pickPhotos = function (d) {
  const input = $('#photoInput');
  if (!input) return;
  input.value = '';
  input.onchange = function () {
    const q = byId(state.quotes, d.id) || currentQuote();
    if (!q) return;
    const files = input.files;
    if (!files || !files.length) return;
    toast(files.length > 1 ? 'Processing ' + files.length + ' photos…' : 'Processing photo…');
    addPhotosToQuote(q, files).then(function (n) {
      if (!n) return;
      persistQuote(q);
      render();
      toast(n + ' photo' + (n === 1 ? '' : 's') + ' added', 'good');
    });
  };
  input.click();
};

ACTIONS.openPhoto = function (d) {
  const q = currentQuote() || byId(state.quotes, route.params.id);
  if (!q) return;
  const rec = quotePhotoRecord(q, d.id);
  const cached = photoCache[d.id];
  if (!rec) return;
  openModal({
    title: 'Photo',
    body: (cached ? '<img class="photo-full" src="' + cached.full + '" alt="' + esc(rec.caption || 'Property photo') + '">'
                  : '<div class="notice warn">This photo is missing from this device\'s storage.</div>') +
      fieldText('ph_cap', 'Caption', rec.caption, { placeholder: 'e.g. North elevation — heavy growth' }) +
      '<label class="inline-check"><input type="checkbox" id="ph_show"' + (rec.includeInProposal ? ' checked' : '') + '> Show this photo to the customer in the proposal</label>' +
      '<div class="hint">Photos are internal by default. Only the ones you mark appear in the proposal and the PDF.</div>',
    footer: '<button class="btn danger" data-act="deletePhoto" data-id="' + d.id + '">' + icon('trash', 16) + ' Delete</button>' +
      '<button class="btn primary" data-act="savePhoto" data-id="' + d.id + '">Save</button>'
  });
};
ACTIONS.savePhoto = function (d) {
  const q = currentQuote() || byId(state.quotes, route.params.id);
  const rec = quotePhotoRecord(q, d.id);
  if (!rec) return;
  rec.caption = val('ph_cap');
  rec.includeInProposal = $('#ph_show').checked;
  persistQuote(q);
  closeModal();
  render();
};
ACTIONS.deletePhoto = function (d) {
  const q = currentQuote() || byId(state.quotes, route.params.id);
  confirmDialog({ title: 'Delete photo?', message: 'This removes it from the quote and from this device.', confirmLabel: 'Delete', danger: true })
    .then(function (okDel) {
      if (!okDel) return;
      removeQuotePhoto(q, d.id).then(function () {
        persistQuote(q);
        closeModal();
        render();
        toast('Photo deleted', 'good');
      });
    });
};

/* Storage usage, so it is obvious when a device is filling up. */
function storageEstimate() {
  if (!navigator.storage || !navigator.storage.estimate) return Promise.resolve(null);
  return navigator.storage.estimate().then(function (e) {
    return { usage: e.usage || 0, quota: e.quota || 0 };
  }).catch(function () { return null; });
}
/* ==========================================================================
   BOOT
   ========================================================================== */
function init() {
  /* brand marks — embedded, so nothing is fetched at runtime */
  const sb = document.getElementById('sbLogo'); if (sb) sb.src = BRAND_MARK_MONO;
  const tm = document.getElementById('topMark'); if (tm) tm.src = BRAND_MARK_MONO;

  const loaded = loadState();
  if (loaded) {
    state = loaded;
    if (!state.services.length) seedCatalog(state);
  } else {
    state = seedDemoData();
    saveState();
  }
  render();
}

try {
  init();
} catch (err) {
  console.error(err);
  document.getElementById('view').innerHTML =
    '<div class="card"><div class="empty"><h3>Something went wrong starting the prototype</h3>' +
    '<p class="small">' + String(err && err.message ? err.message : err) + '</p>' +
    '<div class="btn-row mt-12" style="justify-content:center"><button class="btn danger" onclick="localStorage.removeItem(\'sundaypin.estimator.v1\');location.reload()">Reset local data</button></div></div></div>';
}
</script>
</body>
