<title>Sunday Pin Estimator</title>
<style>
/* ==========================================================================
   SUNDAY PIN ESTIMATOR — PROTOTYPE STYLES
   Mobile-first. Desktop enhancements at >=900px.
   ========================================================================== */

/* Palette taken from the Sunday Pin logo: navy, sage, warm stone.
   Neutrals carry a warm bias so the app sits on paper, not on blue-grey. */
:root{
  --brand-900:#101f30;
  --brand-800:#16293e;
  --brand-700:#1d3c58;
  --brand-600:#2a5479;
  --brand-050:#eceff4;
  --accent:#6b7752;
  --accent-050:#eff2e9;
  --sage:#899370;
  --stone:#c6bfb5;

  --ink:#14202b;
  --ink-2:#3c4a56;
  --ink-3:#6d7783;
  --line:#e3e1db;
  --line-2:#efede8;
  --bg:#f6f5f2;
  --surface:#ffffff;

  --good:#15803d;
  --good-bg:#e9f6ee;
  --warn:#b45309;
  --warn-bg:#fdf3e6;
  --bad:#b3261e;
  --bad-bg:#fceceb;
  --info-bg:#eef4fb;

  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:22px;
  --sh-1:0 1px 2px rgba(20,32,43,.06), 0 1px 3px rgba(20,32,43,.04);
  --sh-2:0 2px 6px rgba(20,32,43,.07), 0 8px 24px rgba(20,32,43,.06);
  --sh-3:0 10px 40px rgba(20,32,43,.2);

  --nav-h:64px;
  --sum-h:86px;
  --safe-b:env(safe-area-inset-bottom, 0px);

  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--font); color:var(--ink); background:var(--bg);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:-.01em; line-height:1.25}
h1{font-size:22px}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0 0 10px}
a{color:var(--brand-700)}
button{font-family:inherit}
:focus-visible{outline:3px solid rgba(42,84,121,.45); outline-offset:2px; border-radius:6px}

/* ---------- layout shell ---------- */
#app{min-height:100vh; display:flex; flex-direction:column}
.sidebar{display:none}
.topbar{
  position:sticky; top:0; z-index:40; background:var(--brand-900); color:#fff;
  padding:10px 14px calc(10px) 14px; display:flex; align-items:center; gap:12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.brandmark{display:flex; flex-direction:column; line-height:1.1; min-width:0}
.brandmark .b1{font-weight:700; font-size:15px; letter-spacing:.01em}
.brandmark .b2{font-size:10.5px; color:#a8b6c6; letter-spacing:.08em; text-transform:uppercase}
.topbar .spacer{flex:1}
/* On a narrow screen the back button and view title win the space. */
.topbar.has-back .brandmark,.topbar.has-back .topbar-mark{display:none}
.topbar-title{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar-btn{
  background:rgba(255,255,255,.12); color:#fff; border:0; border-radius:999px;
  padding:8px 14px; font-size:13.5px; font-weight:600; cursor:pointer;
}
.topbar-btn:hover{background:rgba(255,255,255,.2)}
.topbar-title{font-size:15px; font-weight:650}

main#view{
  flex:1; padding:16px 14px calc(var(--nav-h) + var(--safe-b) + 22px) 14px;
  max-width:1280px; width:100%; margin:0 auto;
}
body.editor-mode main#view{padding-bottom:calc(var(--sum-h) + var(--safe-b) + 24px)}

.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:rgba(255,255,255,.97); backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line); display:flex;
  padding-bottom:var(--safe-b);
}
.bottomnav button{
  flex:1; background:none; border:0; padding:9px 2px 8px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-3); font-size:10.5px; font-weight:600; letter-spacing:.01em;
  min-height:var(--nav-h);
}
.bottomnav button svg{width:22px; height:22px}
.bottomnav button.active{color:var(--brand-700)}
.bottomnav button.fab-nav{color:var(--brand-700)}
body.editor-mode .bottomnav{display:none}

/* ---------- typography helpers ---------- */
.page-head{margin-bottom:14px}
.page-head .sub{color:var(--ink-3); font-size:13.5px; margin-top:3px}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.strong{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
.right{text-align:right}
.nowrap{white-space:nowrap}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.hr{height:1px; background:var(--line); border:0; margin:14px 0}

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--sh-1); padding:16px; margin-bottom:14px;
}
.card.tight{padding:13px}
.card.flush{padding:0; overflow:hidden}
.card-head{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.card-head h2,.card-head h3{flex:1; min-width:0}
.section-title{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin:22px 0 10px}

/* ---------- stat grid ---------- */
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:6px}
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 14px; box-shadow:var(--sh-1);
}
.stat .k{font-size:11.5px; color:var(--ink-3); font-weight:600; letter-spacing:.02em}
.stat .v{font-size:23px; font-weight:700; letter-spacing:-.02em; margin-top:4px; font-variant-numeric:tabular-nums}
.stat .n{font-size:11.5px; color:var(--ink-3); margin-top:2px}
.stat.accent{background:linear-gradient(155deg,var(--brand-800),var(--brand-900)); border-color:var(--brand-900); color:#fff}
.stat.accent .k,.stat.accent .n{color:#a8b6c6}

/* ---------- buttons ---------- */
.btn{
  -webkit-appearance:none; appearance:none; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); border-radius:11px;
  padding:11px 15px; font-size:14.5px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px; transition:background .13s, border-color .13s, transform .06s;
  text-decoration:none;
}
.btn:hover{background:#faf9f7}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand-700); border-color:var(--brand-700); color:#fff}
.btn.primary:hover{background:var(--brand-600)}
.btn.dark{background:var(--brand-900); border-color:var(--brand-900); color:#fff}
.btn.dark:hover{background:var(--brand-800)}
.btn.accent{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent; border-color:transparent; color:var(--brand-700)}
.btn.ghost:hover{background:var(--brand-050)}
.btn.danger{color:var(--bad); border-color:#f0cfcd; background:#fff}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{min-height:36px; padding:7px 11px; font-size:13px; border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn-row{display:flex; gap:9px; flex-wrap:wrap}
.btn-row.stack{flex-direction:column}
.btn-row.stack .btn{width:100%}

/* ---------- forms ---------- */
.field{margin-bottom:13px}
.field > label,.lbl{
  display:block; font-size:12.5px; font-weight:650; color:var(--ink-2); margin-bottom:5px;
}
.hint{font-size:11.5px; color:var(--ink-3); margin-top:5px}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],select,textarea{
  width:100%; font-family:inherit; font-size:16px; color:var(--ink);
  background:var(--surface); border:1px solid #d2cec6; border-radius:11px;
  padding:12px 13px; min-height:46px; -webkit-appearance:none; appearance:none;
}
textarea{min-height:84px; line-height:1.5; resize:vertical}
select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%236d7783' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");
  background-repeat:no-repeat; background-position:right 11px center; padding-right:36px;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand-600); outline:none; box-shadow:0 0 0 3px rgba(42,84,121,.14)}
input.err,select.err,textarea.err{border-color:var(--bad); background:#fffafa}
.err-msg{color:var(--bad); font-size:12px; margin-top:5px; font-weight:600}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px}
.inline-check{display:flex; align-items:center; gap:9px; padding:9px 0; font-size:14px; font-weight:600; color:var(--ink-2)}
.inline-check input{width:20px; height:20px; min-height:0; accent-color:var(--brand-700)}
.search-wrap{position:relative}
.search-wrap input{padding-left:38px}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--ink-3)}

/* ---------- chips / segmented ---------- */
.chiprow{display:flex; flex-wrap:wrap; gap:7px}
.chip{
  border:1px solid #d2cec6; background:var(--surface); color:var(--ink-2);
  border-radius:999px; padding:9px 14px; font-size:13.5px; font-weight:600;
  cursor:pointer; min-height:40px; display:inline-flex; align-items:center; gap:6px;
}
.chip:hover{background:#faf9f7}
.chip[aria-pressed="true"], .chip.on{
  background:var(--brand-700); border-color:var(--brand-700); color:#fff;
}
.chip.soft[aria-pressed="true"]{background:var(--accent); border-color:var(--accent)}
.seg{display:flex; background:#eae8e2; border-radius:12px; padding:3px; gap:3px}
.seg button{
  flex:1; border:0; background:transparent; border-radius:9px; padding:9px 8px;
  font-size:13.5px; font-weight:650; color:var(--ink-2); cursor:pointer; min-height:40px;
}
.seg button.on{background:#fff; color:var(--brand-800); box-shadow:var(--sh-1)}

/* ---------- badges ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; border-radius:999px;
  padding:3px 9px; font-size:11.5px; font-weight:700; letter-spacing:.02em;
  background:var(--line-2); color:var(--ink-2); white-space:nowrap;
}
.badge.draft{background:#eef2f5; color:#53656f}
.badge.ready{background:var(--info-bg); color:#1d5b96}
.badge.sent{background:#e9eefb; color:#3b4ea8}
.badge.accepted{background:var(--good-bg); color:var(--good)}
.badge.declined{background:var(--bad-bg); color:var(--bad)}
.badge.expired{background:var(--warn-bg); color:var(--warn)}
.badge.archived{background:#eef2f5; color:#8a99a3}
.badge.good{background:var(--good-bg); color:var(--good)}
.badge.warn{background:var(--warn-bg); color:var(--warn)}
.badge.bad{background:var(--bad-bg); color:var(--bad)}
.badge.brand{background:var(--brand-050); color:var(--brand-700)}

/* ---------- list rows ---------- */
.rows{display:flex; flex-direction:column}
.row{
  display:flex; align-items:center; gap:12px; padding:13px 14px;
  border-bottom:1px solid var(--line-2); background:none; border-left:0; border-right:0; border-top:0;
  width:100%; text-align:left; cursor:pointer; font-family:inherit; font-size:15px; color:inherit;
}
.row:last-child{border-bottom:0}
.row:hover{background:#faf9f7}
.row .rmain{flex:1; min-width:0; display:block}
.row .rtitle{display:block; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .rsub{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .rside{text-align:right; flex-shrink:0}
.row .ramt{font-weight:700; font-variant-numeric:tabular-nums}
.avatar{
  width:38px; height:38px; border-radius:11px; background:var(--brand-050); color:var(--brand-700);
  display:grid; place-items:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.avatar.g{background:#eaf5ef; color:var(--good)}
.avatar.c{background:#eef1fa; color:#3b4ea8}
.avatar.e{background:#fbf0e8; color:var(--warn)}

/* ---------- empty state ---------- */
.empty{
  text-align:center; padding:34px 18px; color:var(--ink-3);
}
.empty .ico{
  width:52px; height:52px; border-radius:16px; background:var(--line-2); color:var(--ink-3);
  display:grid; place-items:center; margin:0 auto 12px;
}
.empty h3{color:var(--ink-2); margin-bottom:5px}

/* ---------- tables (desktop) ---------- */
.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.data{width:100%; border-collapse:collapse; font-size:13.5px}
table.data th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.07em;
  color:var(--ink-3); font-weight:700; padding:9px 10px; border-bottom:1px solid var(--line);
  white-space:nowrap;
}
table.data td{padding:11px 10px; border-bottom:1px solid var(--line-2); vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data td.num,table.data th.num{text-align:right; font-variant-numeric:tabular-nums}

/* ---------- key/value lines ---------- */
.kv{display:flex; justify-content:space-between; gap:14px; padding:7px 0; font-size:14px}
.kv + .kv{border-top:1px solid var(--line-2)}
.kv .k{color:var(--ink-3)}
.kv .v{font-weight:650; font-variant-numeric:tabular-nums; text-align:right}
.kv.total{border-top:1.5px solid var(--ink); margin-top:5px; padding-top:11px; font-size:16px}
.kv.total .k{color:var(--ink); font-weight:650}
.kv.total .v{font-size:18px}
.kv.sub .k,.kv.sub .v{font-size:13px; color:var(--ink-3); font-weight:500}

/* ---------- stepper ---------- */
.stepper{display:flex; gap:6px; margin-bottom:16px}
.stepper .st{
  flex:1; text-align:center; font-size:11px; font-weight:700; letter-spacing:.02em;
  color:var(--ink-3); padding-top:9px; border-top:3px solid var(--line);
  background:none; border-left:0; border-right:0; border-bottom:0; cursor:pointer;
  text-transform:uppercase;
}
.stepper .st.done{color:var(--brand-700); border-top-color:var(--brand-600)}
.stepper .st.on{color:var(--brand-900); border-top-color:var(--brand-900)}

/* ---------- service catalog picker ---------- */
.svc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.svc-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:12px; text-align:left; cursor:pointer; min-height:88px; box-shadow:var(--sh-1);
  display:flex; flex-direction:column; gap:4px; font-family:inherit;
}
.svc-card:hover{border-color:var(--brand-600); background:#fafbfc}
.svc-card .sc-name{font-weight:650; font-size:14px; line-height:1.25}
.svc-card .sc-code{font-size:10.5px; color:var(--ink-3); font-family:var(--mono); letter-spacing:.02em}
.svc-card .sc-rate{font-size:12px; color:var(--brand-700); font-weight:650; margin-top:auto}
.svc-card.added{border-color:var(--accent); background:var(--accent-050)}
.svc-card .sc-added{font-size:11px; font-weight:700; color:var(--accent)}

/* ---------- quote item cards ---------- */
.item-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--sh-1); margin-bottom:12px; overflow:hidden;
}
.item-head{display:flex; align-items:center; gap:11px; padding:13px 14px; cursor:pointer; background:none; border:0; width:100%; text-align:left; font-family:inherit}
.item-head .ih-main{flex:1; min-width:0; display:block}
.item-head .ih-name{display:block; font-weight:650; font-size:15px}
.item-head .ih-sub{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px}
.item-head .ih-price{font-weight:700; font-variant-numeric:tabular-nums; font-size:15.5px}
.item-head .caret{color:var(--ink-3); transition:transform .16s; flex-shrink:0}
.item-card.open .caret{transform:rotate(180deg)}
.item-body{padding:2px 14px 14px; border-top:1px solid var(--line-2)}
.item-card:not(.open) .item-body{display:none}
.metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0}
.metric{background:var(--bg); border-radius:10px; padding:9px 10px}
.metric .mk{font-size:10.5px; color:var(--ink-3); font-weight:650; text-transform:uppercase; letter-spacing:.05em}
.metric .mv{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px}
.adj-group{margin-bottom:11px}
.adj-group .lbl{margin-bottom:6px}
.calc-trace{
  background:var(--bg); border:1px dashed var(--line); border-radius:10px; padding:10px 12px;
  font-size:12.5px; color:var(--ink-2); margin-top:10px;
}
.calc-trace .ct-line{display:flex; justify-content:space-between; padding:2px 0; font-variant-numeric:tabular-nums}
.calc-trace .ct-line.tot{border-top:1px solid var(--line); margin-top:4px; padding-top:5px; font-weight:700}
.disclosure{margin-top:10px; border-top:1px solid var(--line-2); padding-top:10px}
.disclosure > summary{
  cursor:pointer; font-size:13px; font-weight:650; color:var(--brand-700); list-style:none;
  padding:6px 0; min-height:34px; display:flex; align-items:center; gap:6px;
}
.disclosure > summary::-webkit-details-marker{display:none}
.disclosure > summary::before{content:"›"; font-size:17px; transition:transform .15s; display:inline-block}
.disclosure[open] > summary::before{transform:rotate(90deg)}

/* ---------- brand marks ---------- */
.sb-mark{display:block; width:34px; height:auto; flex-shrink:0}
.sb-words{min-width:0}
.topbar-mark{display:block; width:22px; height:auto; flex-shrink:0}
.prop-logo{display:block; width:190px; height:auto; margin-bottom:4px}
.prop-head .prop-brand.with-logo .p1,.prop-head .prop-brand.with-logo .p2{display:none}

/* ---------- photos ---------- */
.photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px}
.photo-tile{
  position:relative; padding:0; border:1px solid var(--line); background:var(--bg);
  border-radius:12px; overflow:hidden; aspect-ratio:4/3; cursor:pointer; display:block; width:100%;
}
.photo-tile img{width:100%; height:100%; object-fit:cover; display:block}
.photo-tile.shown{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-050)}
.photo-tile .photo-flag{
  position:absolute; left:5px; top:5px; background:var(--accent); color:#fff;
  font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:999px; letter-spacing:.02em;
}
.photo-tile .photo-cap{
  position:absolute; left:0; right:0; bottom:0; padding:14px 7px 5px;
  background:linear-gradient(transparent,rgba(16,31,48,.82)); color:#fff;
  font-size:10.5px; font-weight:600; text-align:left; overflow:hidden;
  white-space:nowrap; text-overflow:ellipsis;
}
.photo-missing{display:grid; place-items:center; height:100%; color:var(--warn)}
.photo-full{width:100%; border-radius:12px; margin-bottom:14px; display:block}
.prop-photos{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.prop-photos figure{margin:0}
.prop-photos img{width:100%; border-radius:8px; display:block; border:1px solid var(--line)}
.prop-photos figcaption{font-size:11.5px; color:var(--ink-3); margin-top:5px}

/* ---------- crew stepper ---------- */
.crew-rows{display:flex; flex-direction:column}
.crew-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line-2)}
.crew-row:last-child{border-bottom:0}
.crew-row .cr-main{flex:1; min-width:0}
.crew-row .cr-name{font-weight:650; font-size:14.5px}
.crew-row .cr-rate{font-size:12px; color:var(--brand-700); font-weight:600; margin-top:2px}
.stepper-ctl{display:flex; align-items:center; gap:5px; flex-shrink:0}
.stepper-ctl .btn{min-width:42px; min-height:42px; font-size:19px; line-height:1; padding:0}
.stepper-ctl .cr-count{min-width:32px; text-align:center; font-size:17px; font-weight:700}

/* ---------- sticky quote summary ---------- */
.qsum-mobile{
  position:fixed; left:0; right:0; bottom:0; z-index:46; background:var(--brand-900); color:#fff;
  padding:10px 14px calc(10px + var(--safe-b)); box-shadow:0 -6px 22px rgba(16,31,48,.28);
  display:flex; align-items:center; gap:12px; min-height:var(--sum-h);
}
.qsum-mobile .qs-left{flex:1; min-width:0}
.qsum-mobile .qs-price{font-size:24px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.qsum-mobile .qs-meta{font-size:11.5px; color:#a8b6c6; margin-top:2px}
.qsum-mobile .btn{background:#fff; border-color:#fff; color:var(--brand-900)}
.qsum-desktop{display:none}

/* ---------- proposal ---------- */
.proposal{
  background:#fff; border:1px solid var(--line); border-radius:var(--r-lg);
  padding:22px 18px; box-shadow:var(--sh-1); max-width:820px; margin:0 auto;
}
.prop-head{border-bottom:2px solid var(--brand-900); padding-bottom:14px; margin-bottom:16px}
.prop-brand .p1{font-size:21px; font-weight:700; letter-spacing:-.01em; color:var(--brand-900)}
.prop-brand .p2{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-top:3px}
.prop-co{font-size:12px; color:var(--ink-3); margin-top:8px; line-height:1.6}
.prop-meta{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-top:16px}
.prop-meta .m-k{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:700}
.prop-meta .m-v{font-weight:650; font-size:14px; margin-top:2px}
.prop-sec{margin-top:22px}
.prop-sec > h3{
  font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--brand-700);
  border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:12px;
}
.prop-group{margin-bottom:14px}
.prop-group > h4{font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin:0 0 2px}
.prop-line{padding:11px 0; border-bottom:1px solid var(--line-2)}
.prop-line:last-child{border-bottom:0}
.prop-line .pl-top{display:flex; justify-content:space-between; gap:14px; align-items:baseline}
.prop-line .pl-name{font-weight:650}
.prop-line .pl-qty{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.prop-line .pl-desc{font-size:13px; color:var(--ink-2); margin-top:5px; line-height:1.5}
.prop-total{
  display:flex; justify-content:space-between; align-items:baseline; margin-top:14px;
  border-top:2px solid var(--brand-900); padding-top:12px;
}
.prop-total .t-k{font-weight:700}
.prop-total .t-v{font-size:24px; font-weight:700; font-variant-numeric:tabular-nums}
.opt-card{
  border:1px solid var(--line); border-radius:var(--r); padding:15px; margin-bottom:12px; background:#fff;
}
.opt-card.rec{border:2px solid var(--brand-700); box-shadow:0 4px 18px rgba(29,60,88,.14)}
.opt-card .oc-head{display:flex; align-items:center; gap:9px; margin-bottom:4px; flex-wrap:wrap}
.opt-card .oc-name{font-size:16px; font-weight:700}
.opt-card .oc-price{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; margin:6px 0 10px}
.opt-card ul{margin:0; padding-left:18px; font-size:13.5px; color:var(--ink-2)}
.opt-card li{margin-bottom:4px}
.prop-body-text{font-size:13.5px; color:var(--ink-2); line-height:1.6; white-space:pre-wrap}
.prop-list{margin:0; padding-left:19px; font-size:13.5px; color:var(--ink-2); line-height:1.6}
.prop-list li{margin-bottom:5px}
.sign-box{border:1px dashed #b9c6cd; border-radius:var(--r); padding:16px; margin-top:12px}
.sign-line{border-bottom:1px solid var(--ink-3); height:34px; margin-top:16px}
.sign-cap{font-size:11px; color:var(--ink-3); margin-top:5px; letter-spacing:.04em; text-transform:uppercase}

/* ---------- internal-only marker ---------- */
.internal-flag{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:var(--warn); background:var(--warn-bg);
  padding:4px 9px; border-radius:999px;
}
.notice{
  background:var(--info-bg); border:1px solid #d3e2f2; color:#1d4f7d; border-radius:var(--r);
  padding:11px 13px; font-size:12.5px; line-height:1.5; margin-bottom:12px;
}
.notice.warn{background:var(--warn-bg); border-color:#f0dcc0; color:#8a4b09}
.notice strong{font-weight:700}

/* ---------- modal ---------- */
.modal-back{
  position:fixed; inset:0; background:rgba(11,26,34,.5); z-index:80;
  display:flex; align-items:flex-end; justify-content:center; padding:0;
  animation:fade .15s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px)}to{transform:translateY(0)}}
.modal{
  background:var(--surface); width:100%; max-width:560px; max-height:92vh;
  border-radius:var(--r-xl) var(--r-xl) 0 0; box-shadow:var(--sh-3);
  display:flex; flex-direction:column; animation:rise .2s ease;
}
.modal-head{display:flex; align-items:center; gap:12px; padding:16px 16px 12px; border-bottom:1px solid var(--line-2)}
.modal-head h2{flex:1; font-size:17px}
.modal-body{padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1}
.modal-foot{padding:12px 16px calc(14px + var(--safe-b)); border-top:1px solid var(--line-2); display:flex; gap:9px}
.modal-foot .btn{flex:1}
.iconbtn{
  background:none; border:0; padding:8px; cursor:pointer; color:var(--ink-3); border-radius:9px;
  display:grid; place-items:center; min-width:40px; min-height:40px;
}
.iconbtn:hover{background:var(--line-2); color:var(--ink)}

/* ---------- toasts ---------- */
#toasts{position:fixed; left:12px; right:12px; bottom:calc(var(--nav-h) + var(--safe-b) + 12px); z-index:90; display:flex; flex-direction:column; gap:8px; pointer-events:none}
.toast{
  background:var(--ink); color:#fff; border-radius:12px; padding:12px 14px; font-size:13.5px;
  font-weight:600; box-shadow:var(--sh-2); animation:rise .18s ease; display:flex; gap:9px; align-items:center;
}
.toast.good{background:#14532d}
.toast.bad{background:#7f1d1d}

/* ---------- misc ---------- */
.pill-list{display:flex; flex-wrap:wrap; gap:6px}
.tag{background:var(--line-2); color:var(--ink-2); border-radius:7px; padding:3px 8px; font-size:11.5px; font-weight:600}
.divider-label{display:flex; align-items:center; gap:10px; color:var(--ink-3); font-size:12px; font-weight:650; margin:14px 0}
.divider-label::before,.divider-label::after{content:""; flex:1; height:1px; background:var(--line)}
.skeleton{background:linear-gradient(90deg,#eef2f5,#f7fafb,#eef2f5); background-size:200% 100%; animation:sk 1.1s infinite; border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.fade-in{animation:fadein .18s ease}
@keyframes fadein{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.var-up{color:var(--bad); font-weight:700}
.var-down{color:var(--good); font-weight:700}
.var-flat{color:var(--ink-3); font-weight:700}

/* ==========================================================================
   DESKTOP
   ========================================================================== */
@media (min-width:900px){
  body{font-size:14.5px}
  #app{flex-direction:row}
  .sidebar{
    display:flex; flex-direction:column; width:236px; flex-shrink:0;
    background:var(--brand-900); color:#fff; position:sticky; top:0; height:100vh; padding:20px 12px;
  }
  .sidebar .sb-brand{padding:4px 10px 20px; display:flex; align-items:center; gap:11px}
  .sidebar .sb-brand .b1{font-size:17px; font-weight:700}
  .sidebar .sb-brand .b2{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#a8b6c6; margin-top:3px}
  .sidebar nav{display:flex; flex-direction:column; gap:2px; flex:1}
  .sidebar nav button{
    display:flex; align-items:center; gap:11px; background:none; border:0; color:#c2ccd8;
    padding:11px 12px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; text-align:left;
  }
  .sidebar nav button svg{width:19px; height:19px; flex-shrink:0}
  .sidebar nav button:hover{background:rgba(255,255,255,.08); color:#fff}
  .sidebar nav button.active{background:rgba(255,255,255,.14); color:#fff}
  .sidebar .sb-new{margin:0 2px 14px}
  .sidebar .sb-foot{font-size:11px; color:#8492a2; padding:12px 12px 0; border-top:1px solid rgba(255,255,255,.12)}
  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .topbar{background:#fff; color:var(--ink); border-bottom:1px solid var(--line); padding:12px 24px}
  .topbar .brandmark,.topbar .topbar-mark{display:none}
  .topbar-btn{background:var(--brand-050); color:var(--brand-700)}
  .topbar-btn:hover{background:#dde3ec}
  main#view{padding:24px 24px 60px}
  body.editor-mode main#view{padding-bottom:60px}
  .bottomnav{display:none}
  .qsum-mobile{display:none}
  .stats{grid-template-columns:repeat(4,1fr); gap:12px}
  .svc-grid{grid-template-columns:repeat(3,1fr)}
  .editor-layout{display:grid; grid-template-columns:minmax(0,1fr) 328px; gap:20px; align-items:start}
  .qsum-desktop{display:block; position:sticky; top:88px}
  .qsum-desktop .card{background:var(--brand-900); color:#fff; border-color:var(--brand-900)}
  .qsum-desktop .card .kv{color:#c2ccd8}
  .qsum-desktop .card .kv .k{color:#a8b6c6}
  .qsum-desktop .card .kv .v{color:#fff}
  .qsum-desktop .card .kv.total{border-top-color:rgba(255,255,255,.35)}
  .qsum-desktop .card .kv.total .k{color:#fff}
  .modal-back{align-items:center; padding:24px}
  .modal{border-radius:var(--r-xl); max-height:86vh}
  .modal-foot{padding-bottom:14px}
  #toasts{left:auto; right:24px; bottom:24px; width:340px}
  .grid-2col{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start}
  .proposal{padding:36px 40px}
  .prop-opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px}
  .opt-card{margin-bottom:0}
}
@media (min-width:1200px){
  .stats.six{grid-template-columns:repeat(4,1fr)}
}

/* ==========================================================================
   PRINT — customer proposal only
   ========================================================================== */
#printRoot{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important}
  .sidebar,.topbar,.bottomnav,.qsum-mobile,.qsum-desktop,#toasts,.no-print,.modal-back{display:none!important}
  /* printing from anywhere: the hidden print root wins over the live view */
  body.printing #app{display:none!important}
  body.printing #printRoot{display:block!important}
  main#view{padding:0!important; max-width:none!important}

/* ==========================================================================

   ========================================================================== */
function num(v) {
  const n = typeof v === 'number' ? v : parseFloat(v);
  return isFinite(n) ? n : 0;
}
function round(v, dp) {
  const f = Math.pow(10, dp == null ? 2 : dp);
  return Math.round((num(v) + Number.EPSILON) * f) / f;
}
function money(v) {
  const n = num(v);
  return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function money0(v) {
  const n = num(v);
  return (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
}
function hrs(v, dp) { return round(v, dp == null ? 1 : dp).toFixed(dp == null ? 1 : dp); }
function pct(v, dp) { return round(v, dp == null ? 1 : dp).toFixed(dp == null ? 1 : dp) + '%'; }
function qty(v) { return num(v).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDaysISO(iso, days) {
  const p = iso.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  d.setDate(d.getDate() + num(days));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDate(iso) {
  if (!iso) return '—';
  const p = String(iso).slice(0, 10).split('-').map(Number);
  if (p.length !== 3 || !p[0]) return '—';
  const d = new Date(p[0], p[1] - 1, p[2]);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
    ' at ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function isEmail(s) { return /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(String(s || '').trim()); }
function initials(s) {
  const parts = String(s || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();

function lines(s) { return String(s || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }

function loadState() {
  try {
    const raw = localStorage.getItem(APP.storageKey);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.meta) return null;
    // forward-compatible defaults
    const base = blankState();
    Object.keys(base).forEach(function (k) { if (parsed[k] == null) parsed[k] = base[k]; });
    parsed.settings = deepDefaults(parsed.settings, base.settings);

  } catch (e) {

/* Quotes written before the crew/labor-rate model are upgraded in place and
   pinned to hourly costing, so their historical totals do not move. */
function migrateState(st) {
  if (st.services && st.services.length) syncCatalog(st);
  /* The brand line moved with the logo. Only the untouched default is updated. */
  if (st.settings && st.settings.company && st.settings.company.tagline === 'Professional Exterior Cleaning') {
    st.settings.company.tagline = 'Painting & Cleaning';
  }
  (st.quotes || []).forEach(function (q) {
    const snap = q.economicsSnapshot || {};
    if (!snap.laborRates) {
      snap.laborRates = [{
        id: RATE_STANDARD, name: 'Standard Crew', payBasis: 'hourly',
        costPerHour: num(snap.laborCostPerHour), costPerDay: num(snap.laborCostPerHour) * 8, active: true
      }];
      snap.workDayHours = snap.workDayHours || 8;
      snap.laborCostingBasis = snap.laborCostingBasis || 'hourly';
      q.economicsSnapshot = snap;
    }
    if (!q.laborCostingBasis) q.laborCostingBasis = snap.laborCostingBasis || 'hourly';
    if (!q.crew || !q.crew.length) {
      let size = 1;
      (q.options || []).forEach(function (o) {
        (o.items || []).forEach(function (it) { size = Math.max(size, num(it.crewSize) || 1); });
      });
      q.crew = [{ rateId: snap.laborRates[0].id, count: size }];
    }
  });
}
function deepDefaults(target, defaults) {
  target = target || {};
  Object.keys(defaults).forEach(function (k) {
    if (defaults[k] && typeof defaults[k] === 'object' && !Array.isArray(defaults[k])) {
      target[k] = deepDefaults(target[k], defaults[k]);
    } else if (target[k] === undefined) {
      target[k] = defaults[k];
    }
  });
  return target;
}

/* When this page runs as a hosted artifact rather than a local file, the browser
   download path is unavailable and saving goes through the host instead. */
const isHostedViewer = !!(typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function');
let hostedDownloads = null;
if (isHostedViewer) {
  try { window.claude.use('downloads').then(function (d) { hostedDownloads = d; }, function () {}); } catch (e) { /* ignore */ }
}

/* The backup has to include the images, or restoring it silently loses them. */
function buildBackup() {
  return photoAll().then(function (recs) {
    const photoBlobs = {};
    (recs || []).forEach(function (r) { photoBlobs[r.id] = { full: r.full, thumb: r.thumb, w: r.w, h: r.h, quoteId: r.quoteId }; });
    return JSON.stringify(Object.assign({}, state, { photoBlobs: photoBlobs }), null, 2);
  }).catch(function () { return JSON.stringify(state, null, 2); });
}

function exportData() {
  buildBackup().then(function (json) { deliverBackup(json); });
}

function deliverBackup(json) {
  const filename = 'sunday-pin-estimator-backup-' + todayISO() + '.json';
  if (isHostedViewer) {
    if (!hostedDownloads || !hostedDownloads.save) {
      toast('Saving a backup is not available in this hosted preview — open the local index.html file to export', 'bad');
      return;
    }
    hostedDownloads.save({ filename: filename, data: json }).then(
      function () { markExported(); toast('Backup saved', 'good'); },
      function (err) {
        toast(err && err.code === 'declined' ? 'Backup cancelled' : 'Could not save the backup here', 'bad');
      }
    );
    return;
  }
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  markExported();
  toast('Backup downloaded', 'good');
}

function markExported() {
  state.meta.lastExportAt = new Date().toISOString();
  saveState();
  render();
}

/* Everything lives in one browser. Work done since the last backup is what a
   cleared cache would cost, so the dashboard says so. */
function unbackedUpWork() {
  const since = state.meta.lastExportAt ? new Date(state.meta.lastExportAt).getTime() : 0;
  const seeded = state.meta.seededAt ? new Date(state.meta.seededAt).getTime() : 0;
  const changed = state.quotes.filter(function (q) {
    const t = new Date(q.updatedAt || q.createdAt).getTime();
    return t > since && t > seeded;             // the seeded demo set is not work
  });
  return { count: changed.length, lastExportAt: state.meta.lastExportAt };
}

function importData(json) {
  let parsed;
  try { parsed = JSON.parse(json); } catch (e) { toast('That file is not valid JSON', 'bad'); return false; }
  if (!parsed || !parsed.meta || !Array.isArray(parsed.quotes)) { toast('That file is not a Sunday Pin backup', 'bad'); return false; }
  const base = blankState();
  Object.keys(base).forEach(function (k) { if (parsed[k] == null) parsed[k] = base[k]; });
  parsed.settings = deepDefaults(parsed.settings, base.settings);
  const blobs = parsed.photoBlobs || {};
  delete parsed.photoBlobs;
  state = parsed;
  saveState();
  /* restore the images into IndexedDB */
  Object.keys(blobs).forEach(function (id) {
    const b = blobs[id];
    photoPut({ id: id, quoteId: b.quoteId, full: b.full, thumb: b.thumb, w: b.w, h: b.h, createdAt: new Date().toISOString() })
      .then(function () { photoCache[id] = { thumb: b.thumb, full: b.full, w: b.w, h: b.h }; })
      .catch(function () {});
  });
  return true;
}

/* New catalog entries ship with new versions of the prototype. Existing local
   catalogs pick them up without a reset, and edits already made are never
   overwritten — only genuinely missing codes are added. */

  SERVICE_SEED.forEach(function (r) {
    if (!st.services.some(function (s) { return s.serviceCode === r[0]; })) st.services.push(serviceFromSeed(r));
  });
  MATERIAL_SEED.forEach(function (r) {
    if (!st.materials.some(function (m) { return m.name === r[0]; })) {
      st.materials.push(makeMaterial({ name: r[0], category: r[1], purchaseUnit: r[2], unitCost: r[3] }));

  const paint = st.services.find(function (s) { return s.serviceCode === 'PAINT-001'; });

  st.services.forEach(function (s) {
    if (s.venue) return;
    const seed = SERVICE_SEED.find(function (r) { return r[0] === s.serviceCode; });
    s.venue = seed ? (seed[11] || 'Exterior') : 'Either';
  });
}

/* ==========================================================================
   CALCULATIONS
   All business logic lives here — never inside click handlers.
   Rounding convention: currency 2dp, labor hours 2dp internally / 1dp shown.
   ========================================================================== */

/* Productive labor = quantity ÷ production rate.
   For an hourly billing basis the entered quantity IS the labor. */
function calculateProductiveLabor(item) {
  const b = basis(item.billingBasis);
  const q = num(item.quantity);
  if (b.laborFromQuantity) return round(q, 2);
  const rate = num(item.productionRate);
  if (rate <= 0) return 0;
  return round(q / rate, 2);
}

/* Adjustments either multiply productive labor or add fixed labor hours. */
function calculateLaborAdjustments(item) {
  let multiplier = 1;
  let addedHours = 0;
  const applied = [];
  LABOR_ADJUSTMENTS.forEach(function (group) {
    const chosen = (item.adjustments || {})[group.key];
    const opt = group.options.find(function (o) { return o.id === chosen; }) || group.options[0];
    if (opt.mult !== 1 || opt.add !== 0) {
      applied.push({ group: group.label, label: opt.label, mult: opt.mult, add: opt.add });
    }
    multiplier *= opt.mult;
    addedHours += opt.add;
  });
  (item.flags || []).forEach(function (f) {
    const def = LABOR_FLAGS.find(function (x) { return x.id === f; });
    if (!def) return;
    applied.push({ group: 'Other', label: def.label, mult: def.mult, add: def.add });
    multiplier *= def.mult;
    addedHours += def.add;
  });
  return { multiplier: round(multiplier, 4), addedHours: round(addedHours, 2), applied: applied };
}

/* Total labor for a line item, showing every step of the calculation. */
function calculateTotalLabor(item, crewOverride) {
  const productive = calculateProductiveLabor(item);
  const adj = calculateLaborAdjustments(item);
  const adjustedProductive = round(productive * adj.multiplier + adj.addedHours, 2);
  const setup = num(item.setupHours);
  const cleanup = num(item.cleanupHours);
  const calculated = round(adjustedProductive + setup + cleanup, 2);
  const ov = item.laborOverride || {};
  const overridden = !!(ov.enabled && ov.hours !== null && ov.hours !== '' && num(ov.hours) > 0);
  const final = overridden ? round(num(ov.hours), 2) : calculated;
  const crew = Math.max(1, num(crewOverride) || num(item.crewSize) || 1);
  return {
    productive: productive,
    multiplier: adj.multiplier,
    addedHours: adj.addedHours,
    adjustmentHours: round(adjustedProductive - productive, 2),
    adjustedProductive: adjustedProductive,
    setup: setup,
    cleanup: cleanup,
    calculated: calculated,
    overridden: overridden,
    overrideReason: ov.reason || '',
    final: final,
    crewSize: crew,
    elapsed: round(final / crew, 2),
    applied: adj.applied
  };
}

function calculateLaborCost(laborHours, costPerHour) {
  return round(num(laborHours) * num(costPerHour), 2);
}

/* --- labor rates --------------------------------------------------------
   A rate is paid EITHER by the hour or by the man-day. Whichever it is, the
   other figure is derived through the standard work day, so the two can never
   drift apart.
   ------------------------------------------------------------------------ */
function rateHourly(rate, workDayHours) {
  const wd = Math.max(1, num(workDayHours) || 8);
  return rate.payBasis === 'day' ? round(num(rate.costPerDay) / wd, 4) : num(rate.costPerHour);
}
function rateDaily(rate, workDayHours) {
  const wd = Math.max(1, num(workDayHours) || 8);
  return rate.payBasis === 'day' ? num(rate.costPerDay) : round(num(rate.costPerHour) * wd, 2);
}
function laborRatesOf(econ) {
  return (econ && econ.laborRates && econ.laborRates.length) ? econ.laborRates
    : [{ id: RATE_STANDARD, name: 'Standard Crew', payBasis: 'hourly', costPerHour: num(econ && econ.laborCostPerHour) || 25, costPerDay: (num(econ && econ.laborCostPerHour) || 25) * 8, active: true }];
}
function crewSize(crew) {
  return (crew || []).reduce(function (s, c) { return s + Math.max(0, Math.round(num(c.count))); }, 0);
}
function roundUpTo(value, step) {
  if (!(step > 0)) return round(value, 4);
  return round(Math.ceil(round(num(value) / step, 6) - 1e-9) * step, 4);
}

/* The heart of labor costing.
   Labor hours are man-hours and come from the production rates. The crew turns
   them into on-site hours, and the costing basis turns on-site hours into what
   is actually paid: hourly people are paid for hours worked, day-rate people
   are paid for the rounded-up crew day. */
function calculateCrewLabor(totalLaborHours, quote, econ) {
  const rates = laborRatesOf(econ);
  const wd = Math.max(1, num(econ.workDayHours) || 8);
  const crew = (quote.crew && quote.crew.length) ? quote.crew : [{ rateId: rates[0].id, count: 2 }];
  const size = Math.max(1, crewSize(crew));
  const hours = Math.max(0, num(totalLaborHours));
  const onSite = round(hours / size, 2);
  const basisId = quote.laborCostingBasis || econ.laborCostingBasis || 'hourly';
  const step = basisId === 'full_day' ? 1 : (basisId === 'half_day' ? 0.5 : 0);
  const rawDays = round(onSite / wd, 3);
  const paidDays = hours <= 0 ? 0 : (step ? Math.max(step, roundUpTo(rawDays, step)) : rawDays);

  const roles = crew.filter(function (c) { return num(c.count) > 0; }).map(function (c) {
    const r = byId(rates, c.rateId) || rates[0];
    const count = Math.round(num(c.count));
    const paidByDay = !!step && r.payBasis === 'day';
    const cost = paidByDay
      ? round(count * paidDays * rateDaily(r, wd), 2)
      : round(count * onSite * rateHourly(r, wd), 2);
    return {
      rateId: r.id, name: r.name, count: count, payBasis: r.payBasis,
      hourly: rateHourly(r, wd), daily: rateDaily(r, wd),
      paidAs: paidByDay ? 'day' : 'hour', cost: cost
    };
  });
  const totalCost = round(roles.reduce(function (s, r) { return s + r.cost; }, 0), 2);
  return {
    crewSize: size, roles: roles, workDayHours: wd, basis: basisId,
    laborHours: round(hours, 2),
    manDays: round(hours / wd, 2),
    onSiteHours: onSite,
    rawDays: rawDays,
    paidDays: paidDays,
    totalCost: totalCost,
    /* blended cost of one man-hour on this job — used to allocate cost to lines */
    effectiveHourlyRate: hours > 0 ? round(totalCost / hours, 4) : (roles[0] ? roles[0].hourly : 0)
  };
}
function laborBasisLabel(id) {
  const b = LABOR_COSTING_BASES.find(function (x) { return x.id === id; });
  return b ? b.label : 'Hours';
}

function calculateMaterialCost(item) {
  if (item.materialMode === 'allowance') return round(num(item.materialAllowance), 2);
  if (item.materialMode === 'lines') {
    return round((item.materialLines || []).reduce(function (sum, l) {
      return sum + num(l.quantity) * num(l.unitCost);
    }, 0), 2);
  }
  return 0;
}

/* Base selling price from the snapshotted rate, floored at the minimum charge. */
function calculateServiceBasePrice(item) {
  const b = basis(item.billingBasis);
  const rate = num(item.sellingRate);
  const q = num(item.quantity);
  let raw;
  if (b.id === 'flat') {
    raw = rate * (q > 0 ? q : 1);
  } else {
    raw = rate * q;
  }
  raw = round(raw, 2);
  const min = num(item.minimumCharge);
  const base = Math.max(raw, min);
  return { raw: raw, minimum: min, minimumApplied: min > raw && min > 0, base: round(base, 2) };
}

function calculatePriceAdjustments(item, basePrice) {
  let total = 0;
  const applied = [];
  (item.priceAdjustments || []).forEach(function (a) {
    const amount = a.type === 'percent'
      ? round(num(basePrice) * num(a.value) / 100, 2)
      : round(num(a.value), 2);
    total += amount;
    applied.push({ id: a.id, label: a.label, type: a.type, value: num(a.value), amount: amount });
  });
  return { total: round(total, 2), applied: applied };
}

function calculateRecommendedPrice(item) {
  const bp = calculateServiceBasePrice(item);
  const adj = calculatePriceAdjustments(item, bp.base);
  const recommended = round(Math.max(0, bp.base + adj.total), 2);
  const ov = item.priceOverride || {};
  const overridden = !!(ov.enabled && ov.price !== null && ov.price !== '');
  const quoted = overridden ? round(Math.max(0, num(ov.price)), 2) : recommended;
  const diff = round(quoted - recommended, 2);
  return {
    basePrice: bp.base,
    rawPrice: bp.raw,
    minimumApplied: bp.minimumApplied,
    minimum: bp.minimum,
    adjustments: adj.total,
    adjustmentDetail: adj.applied,
    recommended: recommended,
    quoted: quoted,
    overridden: overridden,
    overrideDiff: diff,
    overridePct: recommended > 0 ? round(diff / recommended * 100, 1) : 0,
    overrideReason: ov.reason || ''
  };
}

/* Everything a single line item needs, in one object.
   `ctx` carries the option's blended hourly labor rate and job crew, so a line
   is costed with the same labor economics as the option it sits in. */
function calculateItemEconomics(item, econ, ctx) {
  ctx = ctx || {};
  const labor = calculateTotalLabor(item, ctx.crewSize);
  const rate = ctx.effectiveHourlyRate != null ? ctx.effectiveHourlyRate : num(econ.laborCostPerHour);
  const laborCost = calculateLaborCost(labor.final, rate);
  const materials = calculateMaterialCost(item);
  const equipment = round(labor.elapsed * num(econ.equipmentCostPerHour), 2);
  const price = calculateRecommendedPrice(item);
  const directCost = round(laborCost + materials + equipment, 2);
  return {
    labor: labor,
    laborCost: laborCost,
    materials: materials,
    equipment: equipment,
    directCost: directCost,
    price: price,
    laborRate: rate,
    contribution: round(price.quoted - directCost, 2),
    margin: price.quoted > 0 ? round((price.quoted - directCost) / price.quoted * 100, 1) : 0
  };
}

function calculateContributionMargin(revenue, totalCost) {
  const r = num(revenue);
  if (r <= 0) return 0;
  return round((r - num(totalCost)) / r * 100, 1);
}

/* Full internal economics for one quote option. INTERNAL ONLY. */
function calculateOptionEconomics(quote, option) {
  const econ = quote.economicsSnapshot || state.settings.economics;
  const items = (option && option.items) || [];

  /* 1. Man-hours come from the production rates and are crew-independent. */
  const laborHours = round(items.reduce(function (s, it) { return s + calculateTotalLabor(it).final; }, 0), 2);

  /* 2. The crew turns man-hours into on-site hours, paid days and labor cost. */
  const crewLabor = calculateCrewLabor(laborHours, quote, econ);

  /* 3. Lines are costed at the job's blended man-hour rate. */
  const ctx = { effectiveHourlyRate: crewLabor.effectiveHourlyRate, crewSize: crewLabor.crewSize };
  let revenue = 0, materials = 0, equipment = 0, recommended = 0;
  const itemCalcs = items.map(function (it) {
    const c = calculateItemEconomics(it, econ, ctx);
    revenue += c.price.quoted;
    recommended += c.price.recommended;
    materials += c.materials;
    equipment += c.equipment;
    return { item: it, calc: c };
  });

  const travel = round(num(quote.travelMiles) * num(econ.travelCostPerMile) + num(quote.mobilizationFlat), 2);
  const other = items.length ? round(num(econ.miscAllowance), 2) : 0;
  const laborCost = crewLabor.totalCost;
  const directCost = round(laborCost + materials + equipment + travel + other, 2);
  revenue = round(revenue, 2);
  const contribution = round(revenue - directCost, 2);

  /* What the same job would cost if labor were billed strictly by the hour —
     shown beside the paid-day figure so the gap is visible, never hidden. */
  const hourlyOnly = calculateCrewLabor(laborHours, { crew: quote.crew, laborCostingBasis: 'hourly' }, econ);

  return {
    optionId: option ? option.id : null,
    itemCount: items.length,
    itemCalcs: itemCalcs,
    revenue: revenue,
    recommendedRevenue: round(recommended, 2),
    laborHours: laborHours,
    manDays: crewLabor.manDays,
    crewLabor: crewLabor,
    crewSize: crewLabor.crewSize,
    onSiteHours: crewLabor.onSiteHours,
    elapsedHours: crewLabor.onSiteHours,
    paidDays: crewLabor.paidDays,
    laborBasis: crewLabor.basis,
    laborCost: laborCost,
    laborCostHourlyBasis: hourlyOnly.totalCost,
    laborRoundingCost: round(laborCost - hourlyOnly.totalCost, 2),
    effectiveHourlyRate: crewLabor.effectiveHourlyRate,
    materials: round(materials, 2),
    equipment: round(equipment, 2),
    travel: travel,
    other: other,
    directCost: directCost,
    contribution: contribution,
    margin: calculateContributionMargin(revenue, directCost),
    targetMargin: num(econ.targetMargin)
  };
}

/* Below / At / Above target — advisory only, never blocking. */
function marginStatus(margin, target) {
  const m = num(margin), t = num(target);
  if (m >= t + 3) return { key: 'above', label: 'Above Target', cls: 'good' };
  if (m >= t - 3) return { key: 'at', label: 'At Target', cls: 'good' };
  if (m >= t - 12) return { key: 'below', label: 'Below Target', cls: 'warn' };
  return { key: 'well_below', label: 'Well Below Target', cls: 'bad' };
}

/* Estimated vs actual. */
function calculateActualVariance(estimated, actual) {
  const e = num(estimated), a = num(actual);
  const diff = round(a - e, 2);
  const pctDiff = e !== 0 ? round(diff / e * 100, 1) : 0;
  return { estimated: e, actual: a, diff: diff, pct: pctDiff, direction: diff > 0.001 ? 'up' : (diff < -0.001 ? 'down' : 'flat') };
}

/* Implied actual production rate for measurable line items. */
function impliedProductionRates(option, actualLaborHours) {
  const items = (option && option.items) || [];
  const est = items.reduce(function (s, it) { return s + calculateTotalLabor(it).final; }, 0);
  if (est <= 0 || num(actualLaborHours) <= 0) return [];
  const factor = num(actualLaborHours) / est;
  return items.filter(function (it) {
    return num(it.quantity) > 0 && num(it.productionRate) > 0 && !basis(it.billingBasis).laborFromQuantity;
  }).map(function (it) {
    const l = calculateTotalLabor(it);
    const impliedHours = round(l.final * factor, 2);
    const productiveShare = impliedHours - it.setupHours - it.cleanupHours;
    const rate = productiveShare > 0 ? round(num(it.quantity) / productiveShare, 0) : 0;
    return {
      name: it.name,
      unitLabel: it.unitLabel,
      quantity: num(it.quantity),
      estimatedRate: num(it.productionRate),
      impliedHours: impliedHours,
      impliedRate: rate
    };
  });
}

/* ==========================================================================
   QUOTE-LEVEL HELPERS
   ========================================================================== */
function quotePrimaryOption(quote) {
  if (!quote.options || !quote.options.length) return null;
  if (quote.acceptance && quote.acceptance.optionId) {
    const accepted = byId(quote.options, quote.acceptance.optionId);
    if (accepted) return accepted;
  }
  return quote.options.find(function (o) { return o.recommended; }) || quote.options[0];
}
function quoteDisplayTotal(quote) {
  const opt = quotePrimaryOption(quote);
  if (!opt) return 0;
  return calculateOptionEconomics(quote, opt).revenue;
}
function quoteItemCount(quote) {
  return (quote.options || []).reduce(function (s, o) { return s + o.items.length; }, 0);
}
/* Expiry is presentational — quotes are never deleted or rewritten. */
function isExpired(quote) {
  if (['Accepted', 'Declined', 'Archived'].indexOf(quote.status) >= 0) return false;
  if (quote.status === 'Expired') return true;
  return daysBetween(todayISO(), quote.validUntil) < 0;
}
function effectiveStatus(quote) {
  return isExpired(quote) ? 'Expired' : quote.status;
}
function needsFollowUp(quote) {
  return quote.status === 'Sent' && quote.sentAt &&
    (Date.now() - new Date(quote.sentAt).getTime()) > 5 * 86400000 && !isExpired(quote);
}
function customerLabel(c) {
  if (!c) return 'Unknown customer';
  if (c.entityType === 'Company' || c.companyName) return c.companyName || 'Unnamed company';
  return ((c.firstName || '') + ' ' + (c.lastName || '')).trim() || 'Unnamed customer';
}
function contactLabel(c) {
  if (!c) return '';
  return ((c.firstName || '') + ' ' + (c.lastName || '')).trim();
}
function propertyLabel(p) {
  if (!p) return 'No property';
  return p.name || p.address || 'Unnamed property';
}
function propertyAddress(p) {
  if (!p) return '';
  const l2 = [p.city, p.state].filter(Boolean).join(', ');
  return [p.address, [l2, p.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
}
function contactsFor(customerId) {
  return state.contacts.filter(function (c) { return c.customerId === customerId && c.active !== false; });
}
function propertiesFor(customerId) {

}
function actualsFor(quoteId) {

/* Dashboard roll-ups. */
function dashboardMetrics() {
  const quotes = state.quotes.filter(function (q) { return q.status !== 'Archived'; });
  const open = quotes.filter(function (q) { return ['Draft', 'Ready', 'Sent'].indexOf(q.status) >= 0 && !isExpired(q); });
  const accepted = quotes.filter(function (q) { return q.status === 'Accepted'; });
  const declined = quotes.filter(function (q) { return q.status === 'Declined'; });
  const decided = accepted.length + declined.length;
  const openValue = open.reduce(function (s, q) { return s + quoteDisplayTotal(q); }, 0);
  const allValues = quotes.filter(function (q) { return quoteItemCount(q) > 0; }).map(quoteDisplayTotal);
  const acceptedValues = accepted.map(quoteDisplayTotal);
  const avg = function (arr) { return arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : 0; };
  return {
    openCount: open.length,
    openValue: openValue,
    acceptedRecent: accepted.slice().sort(function (a, b) { return new Date(b.acceptedAt || 0) - new Date(a.acceptedAt || 0); }).slice(0, 5),
    acceptedCount: accepted.length,
    winRate: decided ? round(accepted.length / decided * 100, 0) : null,
    avgQuote: avg(allValues),
    avgAccepted: avg(acceptedValues),
    followUps: quotes.filter(needsFollowUp),
    expiring: quotes.filter(function (q) {
      const d = daysBetween(todayISO(), q.validUntil);

const modalStack = [];

  const back = document.createElement('div');

        '</button>' +

      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
    '</div>';
  back.addEventListener('click', function (e) {
    if (e.target === back || e.target.closest('[data-modal-close]')) closeModal();
  });
  $('#modalRoot').appendChild(back);
  modalStack.push(back);
  if (typeof opts.onMount === 'function') opts.onMount(back);
  const firstInput = back.querySelector('input,select,textarea');
  if (firstInput && window.innerWidth >= 900) setTimeout(function () { firstInput.focus(); }, 60);
  return back;
}

  const m = modalStack.pop();

}

}

});

  const q = byId(state.quotes, id);
  if (!q) return;
  loadQuotePhotos(q).then(function () { if (route.name === 'editor') render(); });
  editor = { quoteId: id, step: quoteItemCount(q) ? 3 : 1, optionIndex: 0, catalogCat: 'Suggested', catalogVenue: 'All', search: '', open: {}, disc: {} };
  go('editor', { id: id });
}
function currentQuote() {
  const q = byId(state.quotes, editor.quoteId);
  if (q) return q;
  if (pendingQuote && pendingQuote.id === editor.quoteId) return pendingQuote;
  return null;
}
function persistQuote(q) {
  if (!q) return;
  if (!byId(state.quotes, q.id)) {
    q.quoteNumber = q.quoteNumber || nextQuoteNumber();
    state.quotes.push(q);
    if (pendingQuote && pendingQuote.id === q.id) pendingQuote = null;
  }
  q.updatedAt = new Date().toISOString();
  saveState();
}
function currentOption(q) {
  q = q || currentQuote();
  if (!q) return null;
  if (editor.optionIndex >= q.options.length) editor.optionIndex = 0;
  return q.options[editor.optionIndex];
}

/* ==========================================================================
   EDITOR SHELL
   ========================================================================== */
const STEP_LABELS = ['Customer', 'Property', 'Scope', 'Review'];

VIEWS.editor = function () {
  const q = currentQuote();
  if (!q) return '<div class="card"><div class="empty"><h3>Quote not found</h3></div></div>';
  const c = byId(state.customers, q.customerId);

  let body = '';
  body += '<div class="stepper no-print">' + STEP_LABELS.map(function (l, i) {
    const n = i + 1;
    const cls = editor.step === n ? 'on' : (editor.step > n ? 'done' : '');
    return '<button class="st ' + cls + '" data-act="goStep" data-n="' + n + '">' + n + '. ' + l + '</button>';
  }).join('') + '</div>';

  if (editor.step === 1) body += renderStepCustomer(q);
  else if (editor.step === 2) body += renderStepProperty(q);
  else if (editor.step === 3) body += renderStepScope(q);
  else body += renderStepReview(q);

  const econ = summaryEconomics(q);
  return '<div class="editor-layout">' +
      '<div class="editor-main">' + body + '</div>' +
      '<aside class="qsum-desktop no-print">' + renderSummaryCard(q, econ) + '</aside>' +
    '</div>' +
    '<div class="qsum-mobile no-print" id="qsumMobile">' + renderSummaryBar(q, econ) + '</div>';
};
VIEWS.editor_actions = function () {
  return '<button class="topbar-btn" data-act="saveDraft">Save Draft</button>';
};

function summaryEconomics(q) {
  const opt = currentOption(q);
  return calculateOptionEconomics(q, opt || { items: [] });
}

}

function summaryKVs(e) {

function refreshSummary() {
  const q = currentQuote();
  if (!q) return;
  const e = summaryEconomics(q);

  const m = $('#qsumMeta'); if (m) m.textContent = hrs(e.laborHours) + ' man-hrs · ' + (e.paidDays ? round(e.paidDays, 2) + 'd crew · ' : '') + 'cost ' + money0(e.directCost) + ' · ' + pct(e.margin, 0) + ' margin';
  const dp = $('#qsumDeskPrice'); if (dp) dp.textContent = money(e.revenue);

ACTIONS.goStep = function (d) {
  const n = parseInt(d.n, 10);
  if (n > editor.step && !validateStep(editor.step)) return;
  editor.step = n;
  render();
};
ACTIONS.prevStep = function () {
  editor.step = Math.max(1, editor.step - 1);
  render();
  window.scrollTo(0, 0);
};
ACTIONS.nextStep = function () {
  if (!validateStep(editor.step)) return;
  editor.step = Math.min(4, editor.step + 1);
  render();
  window.scrollTo(0, 0);
};
ACTIONS.saveDraft = function () {
  const q = currentQuote();
  if (!q) return;
  if (!q.customerId) { toast('Select a customer first', 'bad'); editor.step = 1; render(); return; }
  persistQuote(q);
  toast('Draft saved as ' + q.quoteNumber, 'good');
  render();
};
ACTIONS.finishQuote = function () {
  const q = currentQuote();
  if (!validateStep(3)) return;
  if (q.status === 'Draft') q.status = 'Ready';
  persistQuote(q);
  toast('Quote ' + q.quoteNumber + ' saved', 'good');
  historyStack.length = 0;
  go('quote', { id: q.id }, true);
};

function validateStep(step) {
  const q = currentQuote();
  if (!q) return false;
  if (step >= 1 && !q.customerId) { toast('Choose or create a customer to continue', 'bad'); editor.step = 1; render(); return false; }
  if (step >= 2 && !q.propertyId) { toast('Choose or create a property to continue', 'bad'); editor.step = 2; render(); return false; }
  if (step >= 3) {
    const opt = currentOption(q);
    if (!opt || !opt.items.length) { toast('Add at least one service to continue', 'bad'); editor.step = 3; render(); return false; }
    const bad = opt.items.filter(function (it) { return num(it.quantity) <= 0 && basis(it.billingBasis).id !== 'flat'; });
    if (bad.length) { toast('Enter a quantity for ' + bad[0].name, 'bad'); editor.step = 3; render(); return false; }
  }
  return true;
}

function renderStepCustomer(q) {

    const primaryCt = contactsFor(c.id).filter(function (x) { return x.isPrimary; })[0] || contactsFor(c.id)[0];
    html += '<div class="card">' +
      '<div class="card-head">' +
        '<span class="avatar">' + esc(initials(customerLabel(c))) + '</span>' +
        '<div style="flex:1;min-width:0"><h2>' + esc(customerLabel(c)) + '</h2>' +
          '<div class="small muted">' + esc(c.customerType) +

      '</div>' +

      '<div class="card-head"><h3>Contacts</h3>' +

    } else {
      html += '<div class="rows">' + cts.map(function (ct) {
        const on = q.recipientContactIds.indexOf(ct.id) >= 0;
        return '<button class="row" data-act="toggleRecipient" data-id="' + ct.id + '">' +
          '<span class="avatar">' + esc(initials(contactLabel(ct))) + '</span>' +
          '<span class="rmain"><span class="rtitle">' + esc(contactLabel(ct)) + (ct.isPrimary ? ' <span class="badge brand">Primary</span>' : '') + '</span>' +
          '<span class="rsub">' + esc([ct.role, ct.email, ct.phone].filter(Boolean).join(' · ')) + '</span></span>' +
          '<span class="rside">' + (on ? '<span class="badge good">' + icon('check', 12) + ' Recipient</span>' : '<span class="badge">Select</span>') + '</span>' +
        '</button>';
      }).join('') + '</div>';

    '</div>' +
    '<button class="btn primary block" data-act="newCustomer">' + icon('plus', 18) + ' New Customer</button>' +
  '</div>';
  html += '<div id="custResults">' + customerResultsHTML(editor.search) + '</div>';
  return html;
}

function customerResultsHTML(term) {
  const t = String(term || '').toLowerCase().trim();
  let list = state.customers.slice();
  if (t) {
    list = list.filter(function (c) {
      const cts = contactsFor(c.id);
      const hay = [customerLabel(c), c.firstName, c.lastName, c.companyName, c.customerType]
        .concat(cts.map(function (x) { return contactLabel(x) + ' ' + x.email + ' ' + x.phone; }))
        .join(' ').toLowerCase();
      return hay.indexOf(t) >= 0;
    });
  }
  list = list.sort(function (a, b) { return customerLabel(a).localeCompare(customerLabel(b)); });
  if (!list.length) {
    return '<div class="card"><div class="empty"><div class="ico">' + icon('user', 24) + '</div>' +
      '<h3>No matches</h3><p class="small">Create a new customer to continue.</p></div></div>';
  }
  return '<div class="card flush"><div class="rows">' + list.map(function (c) {
    const props = propertiesFor(c.id).length;
    const cts = contactsFor(c.id).length;
    const hit = t ? contactsFor(c.id).filter(function (x) {
      return (contactLabel(x) + ' ' + x.email + ' ' + x.phone).toLowerCase().indexOf(t) >= 0;
    })[0] : null;
    const sub = hit && customerLabel(c).toLowerCase().indexOf(t) < 0
      ? 'Matched contact: ' + contactLabel(hit) + (hit.role ? ' · ' + hit.role : '')
      : c.customerType + ' · ' + props + ' propert' + (props === 1 ? 'y' : 'ies') + ' · ' + cts + ' contact' + (cts === 1 ? '' : 's');
    return '<button class="row" data-act="pickCustomer" data-id="' + c.id + '">' +
      '<span class="avatar ' + (c.customerType === 'Golf' ? 'g' : (c.customerType === 'Commercial' ? 'c' : (c.customerType === 'Event' ? 'e' : ''))) + '">' + esc(initials(customerLabel(c))) + '</span>' +
      '<span class="rmain"><span class="rtitle">' + esc(customerLabel(c)) + '</span>' +
      '<span class="rsub">' + esc(sub) + '</span></span>' +
      '<span class="muted">' + icon('chevronRight', 18) + '</span></button>';
  }).join('') + '</div></div>';
}

INPUTS.custSearch = function (d, el) {
  editor.search = el.value;
  const box = $('#custResults');
  if (box) box.innerHTML = customerResultsHTML(editor.search);
};
ACTIONS.pickCustomer = function (d) {
  const q = currentQuote();
  q.customerId = d.id;
  const primary = contactsFor(d.id).filter(function (c) { return c.isPrimary; });
  q.recipientContactIds = primary.length ? [primary[0].id] : [];
  const props = propertiesFor(d.id);
  if (props.length === 1) q.propertyId = props[0].id;
  const c = byId(state.customers, d.id);
  if (c && ['Commercial', 'Golf'].indexOf(c.customerType) >= 0) editor.catalogCat = c.customerType;
  persistQuote(q);
  render();
};
ACTIONS.clearCustomer = function () {
  const q = currentQuote();
  q.customerId = null; q.propertyId = null; q.recipientContactIds = [];
  render();
};
ACTIONS.toggleRecipient = function (d) {
  const q = currentQuote();
  const i = q.recipientContactIds.indexOf(d.id);
  if (i >= 0) q.recipientContactIds.splice(i, 1); else q.recipientContactIds.push(d.id);
  persistQuote(q);
  render();
};
ACTIONS.newCustomer = function () {
  openCustomerForm(null, function (cust, made) {
    const q = currentQuote();
    ACTIONS.pickCustomer({ id: cust.id });
    /* the person whose details you just typed is who the quote goes to */
    if (made && made.contact) q.recipientContactIds = [made.contact.id];
    if (made && made.property) {
      q.propertyId = made.property.id;
      persistQuote(q);
      editor.step = 3;                  // address captured — skip straight to scope
      render();
      toast('Customer and property created', 'good');
      return;
    }
    toast('Customer created', 'good');
  }, { withProperty: true });
};
ACTIONS.addContact = function (d) {
  openContactForm(d.cid, null, function (ct) {
    const q = currentQuote();
    if (q && q.customerId === d.cid && q.recipientContactIds.indexOf(ct.id) < 0) q.recipientContactIds.push(ct.id);
    saveState();
    toast('Contact added', 'good');
    render();
  });
};

/* ---- crew on site ----------------------------------------------------- */
function renderCrewCard(q) {
  const econ = q.economicsSnapshot;
  const rates = laborRatesOf(econ);
  const e = summaryEconomics(q);
  const cl = e.crewLabor;
  const basisId = q.laborCostingBasis || econ.laborCostingBasis;
  const basisDef = LABOR_COSTING_BASES.find(function (x) { return x.id === basisId; }) || LABOR_COSTING_BASES[0];

  let h = '<div class="card"><div class="card-head"><h3>Crew on site</h3>' +
    '<span class="badge brand">' + cl.crewSize + ' ' + (cl.crewSize === 1 ? 'person' : 'people') + '</span></div>';

  h += '<div class="crew-rows">' + rates.filter(function (r) { return r.active !== false; }).map(function (r) {
    const row = (q.crew || []).find(function (c) { return c.rateId === r.id; });
    const count = row ? Math.round(num(row.count)) : 0;
    const per = r.payBasis === 'day'
      ? money(rateDaily(r, cl.workDayHours)) + ' / man-day'
      : money(rateHourly(r, cl.workDayHours)) + ' / hour';
    const alt = r.payBasis === 'day'
      ? money(rateHourly(r, cl.workDayHours)) + ' / hr equivalent'
      : money(rateDaily(r, cl.workDayHours)) + ' / man-day equivalent';
    return '<div class="crew-row">' +
      '<div class="cr-main"><div class="cr-name">' + esc(r.name) + '</div>' +
        '<div class="cr-rate">' + per + ' <span class="muted">· ' + alt + '</span></div></div>' +
      '<div class="stepper-ctl">' +
        '<button class="btn sm" data-act="crewStep" data-rid="' + r.id + '" data-d="-1" aria-label="Fewer ' + esc(r.name) + '">−</button>' +
        '<span class="cr-count num" id="crew_' + r.id + '">' + count + '</span>' +
        '<button class="btn sm" data-act="crewStep" data-rid="' + r.id + '" data-d="1" aria-label="More ' + esc(r.name) + '">+</button>' +
      '</div></div>';
  }).join('') + '</div>';

  h += '<div class="lbl mt-12">Cost labor by</div><div class="seg">' +
    LABOR_COSTING_BASES.map(function (b) {
      return '<button class="' + (basisId === b.id ? 'on' : '') + '" data-act="setLaborBasis" data-b="' + b.id + '">' + b.label + '</button>';
    }).join('') + '</div>' +
    '<div class="hint">' + esc(basisDef.hint) + '</div>';

  h += '<div class="calc-trace mt-12">' +
    '<div class="ct-line"><span>Estimated labor</span><span>' + hrs(e.laborHours) + ' man-hrs · ' + hrs(cl.manDays, 2) + ' man-days</span></div>' +
    '<div class="ct-line"><span>On site with ' + cl.crewSize + '-person crew</span><span>' + hrs(cl.onSiteHours) + ' hrs</span></div>' +
    '<div class="ct-line"><span>Crew days paid (' + hrs(cl.workDayHours, 0) + '-hour day)</span><span>' + (cl.paidDays ? round(cl.paidDays, 2) + ' days' : '—') + '</span></div>' +
    cl.roles.map(function (r) {
      return '<div class="ct-line"><span>' + r.count + ' × ' + esc(r.name) + ' — paid by ' + (r.paidAs === 'day' ? 'day' : 'hour') + '</span><span>' + money(r.cost) + '</span></div>';
    }).join('') +
    '<div class="ct-line tot"><span>Estimated labor cost</span><span>' + money(cl.totalCost) + '</span></div>' +
    (e.laborRoundingCost > 0.005
      ? '<div class="ct-line"><span>Cost of paying for unused crew time</span><span>' + money(e.laborRoundingCost) + ' vs ' + money(e.laborCostHourlyBasis) + ' hourly</span></div>'
      : '') +
  '</div>';

  h += '</div>';
  return h;
}
ACTIONS.crewStep = function (d) {
  const q = currentQuote();
  const delta = parseInt(d.d, 10);
  let row = (q.crew || []).find(function (c) { return c.rateId === d.rid; });
  if (!row) { row = { rateId: d.rid, count: 0 }; q.crew = (q.crew || []).concat([row]); }
  row.count = Math.max(0, Math.round(num(row.count)) + delta);

/* The first interior line on a quote brings the interior assumptions and
   exclusions with it. Added once, then left alone — the estimator can edit or
   delete them on the Review step and they will not come back. */
function applyInteriorTerms(q, item) {
  if (q.interiorTermsApplied) return false;
  if ((item.venue || 'Exterior') !== 'Interior') return false;
  const s = state.settings.quote;
  const append = function (existing, extra) {
    if (!extra) return existing;
    const have = lines(existing);
    const add = lines(extra).filter(function (l) { return have.indexOf(l) < 0; });
    if (!add.length) return existing;
    return (existing ? existing.trim() + '\n' : '') + add.join('\n');
  };
  q.assumptions = append(q.assumptions, s.interiorAssumptions);
  q.exclusions = append(q.exclusions, s.interiorExclusions);
  q.interiorTermsApplied = true;
  return true;
}

ACTIONS.addService = function (d) {
  const q = currentQuote();
  const svc = byId(state.services, d.id);
  if (!svc) return;
  const opt = currentOption(q);
  const item = makeQuoteItem(svc);
  opt.items.push(item);
  editor.open[item.id] = true;
  const addedTerms = applyInteriorTerms(q, item);
  persistQuote(q);
  render();
  if (addedTerms) toast('Interior assumptions and exclusions added to this quote', 'good');
  const el = document.getElementById('item_' + item.id);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const inp = el.querySelector('input[data-oninput="itemQty"]');
    if (inp && window.innerWidth >= 900) inp.focus();
  }
};

/* --- item card ---------------------------------------------------------- */
function findItem(id) {
  const q = currentQuote();
  if (!q) return null;
  for (let i = 0; i < q.options.length; i++) {
    const it = byId(q.options[i].items, id);
    if (it) return { quote: q, option: q.options[i], item: it, index: q.options[i].items.indexOf(it) };
  }
  return null;
}

/* The blended man-hour rate and job crew for the option a line sits in. */
function optionCtx(q, option) {
  const e = calculateOptionEconomics(q, option || currentOption(q) || { items: [] });
  return { effectiveHourlyRate: e.effectiveHourlyRate, crewSize: e.crewSize };
}

  if ((it.priceAdjustments || []).length) {
    h += '<div class="mt-12">' + it.priceAdjustments.map(function (a) {
      return '<div class="kv"><span class="k">' + esc(a.label) + ' <span class="tiny">(' + (a.type === 'percent' ? a.value + '%' : money(a.value)) + ')</span></span>' +
        '<span class="v"><button class="btn sm danger" data-act="delPriceAdj" data-id="' + it.id + '" data-aid="' + a.id + '">Remove</button></span></div>';
    }).join('') + '</div>';
  }

  const ov = it.priceOverride || {};
  h += '<div class="mt-12"><label class="inline-check"><input type="checkbox" data-onchange="itemPriceOvToggle" data-id="' + it.id + '"' + (ov.enabled ? ' checked' : '') + '> Override recommended price</label>';
  if (ov.enabled) {
    h += '<div class="grid2">' +
      '<div class="field"><label for="pov_' + it.id + '">Quoted price</label><input type="number" inputmode="decimal" step="any" min="0" id="pov_' + it.id + '" value="' + esc(ov.price == null ? '' : ov.price) + '" data-oninput="itemPriceOvVal" data-id="' + it.id + '"></div>' +
      '<div class="field"><label for="povr_' + it.id + '">Reason</label><input type="text" id="povr_' + it.id + '" value="' + esc(ov.reason || '') + '" data-oninput="itemPriceOvReason" data-id="' + it.id + '" placeholder="Why the change?"></div>' +
    '</div><div class="tiny muted">Recommended price of ' + money(p.recommended) + ' is preserved on the quote record.</div>';
  }
  h += '</div>';
  return h;
}

function redrawItem(id) {
  const f = findItem(id);
  if (!f) return;

  el.outerHTML = renderItemCard(f.quote, f.item);

}
function updateItemDisplays(id) {
  const f = findItem(id);
  if (!f) return;

  const set = function (sel, html) { const e = document.getElementById(sel); if (e) e.innerHTML = html; };
  set('ihp_' + id, money0(c.price.quoted));

ACTIONS.setMode = function (d) {
  const q = currentQuote();
  if (d.m === q.mode) return;
  if (d.m === 'options') {
    const c = byId(state.customers, q.customerId);
    const names = (c && ['Commercial', 'Golf'].indexOf(c.customerType) >= 0) ? OPTION_NAME_PRESETS.commercial : OPTION_NAME_PRESETS.standard;
    const first = q.options[0];
    first.name = names[0];
    first.recommended = false;
    const second = makeOption(names[1], { recommended: true });
    second.items = first.items.map(function (it) { const cp = clone(it); cp.id = uid('qi'); return cp; });
    const third = makeOption(names[2]);
    third.items = first.items.map(function (it) { const cp = clone(it); cp.id = uid('qi'); return cp; });
    q.options = [first, second, third];
    editor.optionIndex = 1;
    q.mode = 'options';
    toast('Three options created — edit each scope', 'good');
  } else {
    confirmDialog({
      title: 'Switch to a single quote?',
      message: 'Only the currently selected option will be kept.',
      confirmLabel: 'Keep this option', danger: true
    }).then(function (ok) {
      if (!ok) return;
      const keep = q.options[editor.optionIndex];
      keep.recommended = true;
      q.options = [keep];
      editor.optionIndex = 0;
      q.mode = 'single';
      persistQuote(q);
      render();
    });
    return;
  }
  persistQuote(q);
  render();
};
ACTIONS.pickOption = function (d) { editor.optionIndex = parseInt(d.i, 10); render(); };
ACTIONS.renameOption = function () {
  const q = currentQuote();

  openModal({
    title: 'Rename option',
    body: fieldText('opt_name', 'Option name', o.name) +
      fieldText('opt_desc', 'Short description (shown to customer)', o.description, { placeholder: 'e.g. Clubhouse exterior plus pool deck' }),
    footer: '<button class="btn" data-modal-close>Cancel</button><button class="btn primary" data-act="saveOptionName">Save</button>'
  });

};
ACTIONS.dupOption = function () {
  const q = currentQuote();
  const o = currentOption(q);
  const copy = clone(o);
  copy.id = uid('opt');
  copy.name = o.name + ' (copy)';
  copy.recommended = false;
  copy.items.forEach(function (it) { it.id = uid('qi'); (it.materialLines || []).forEach(function (l) { l.id = uid('ml'); }); });
  q.options.splice(editor.optionIndex + 1, 0, copy);
  q.mode = 'options';
  editor.optionIndex = editor.optionIndex + 1;
  persistQuote(q); render();
};
ACTIONS.recommendOption = function () {
  const q = currentQuote();
  q.options.forEach(function (o, i) { o.recommended = i === editor.optionIndex; });
  persistQuote(q); render();
};
ACTIONS.moveOption = function (d) {
  const q = currentQuote();
  const dir = parseInt(d.dir, 10);
  const i = editor.optionIndex, j = i + dir;
  if (j < 0 || j >= q.options.length) return;
  const t = q.options[i]; q.options[i] = q.options[j]; q.options[j] = t;
  editor.optionIndex = j;
  persistQuote(q); render();
};
ACTIONS.removeOption = function () {
  const q = currentQuote();
  if (q.options.length <= 1) return;
  const o = currentOption(q);
  confirmDialog({ title: 'Remove option?', message: 'Remove "' + o.name + '" and its services?', confirmLabel: 'Remove', danger: true })
    .then(function (ok) {
      if (!ok) return;
      q.options.splice(editor.optionIndex, 1);
      if (!q.options.some(function (x) { return x.recommended; })) q.options[0].recommended = true;
      editor.optionIndex = 0;
      if (q.options.length === 1) q.mode = 'single';
      persistQuote(q); render();
    });
};
